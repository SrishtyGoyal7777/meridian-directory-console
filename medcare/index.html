<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedCare Roster Confirmation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#031335;--navy2:#072669;--blue:#2a6af1;--blue2:#5386f4;--blue3:#a9c2f9;--aqua:#1bbce4;--purple:#7034ea;--orange:#ec700a;--t1:#29303d;--t2:#465167;--t3:#5a6884;--bg:#f5f6fa;--card:#fff;--ok:#73b124;--bad:#e25f5a;--line:#e2e8f7;--okt:#4a7a0a;--badt:#b3302b;--ort:#a84d00}
*{box-sizing:border-box}
body{margin:0;font-family:'Satoshi','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);font-size:14px;line-height:1.45}
h1,h2,h3{margin:0;color:var(--navy2);font-weight:800;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:16px}h3{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.shell{display:grid;grid-template-columns:84px minmax(0,1fr);min-height:100vh}
.rail{background:var(--navy);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;display:grid;place-items:center;font-weight:900;margin-bottom:10px}
.nb{width:70px;padding:8px 0;border-radius:12px;color:var(--blue3);background:none;border:0;font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;line-height:1.15}
.nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb:hover{background:#0b1f52}.nb.on{background:var(--blue);color:#fff}
.rail .sp{flex:1}
.main{min-width:0}
.top{box-shadow:0 1px 0 rgba(7,38,105,.04);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .sp{flex:1}
.page{padding:20px 22px 44px;max-width:1280px}
.btn{border:1px solid var(--blue3);background:#fff;color:var(--navy2);border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.btn:hover{background:#eef3ff}
.btn.primary{background:linear-gradient(90deg,var(--blue),var(--purple));color:#fff;border:0}
.btn.primary:hover{filter:brightness(1.08)}
.btn.solid{background:var(--blue);color:#fff;border:0}
.btn.danger{border-color:var(--bad);color:var(--badt)}
.btn.sm{padding:4px 12px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;gap:6px;align-items:center;background:#eaf0ff;color:var(--navy2);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.chip button{border:0;background:none;cursor:pointer;color:var(--navy2);font-weight:900}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(176px,1fr));margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(7,38,105,.04),0 8px 24px -16px rgba(7,38,105,.18);transition:border-color .15s,transform .15s}
.kpi:hover{border-color:var(--blue2);transform:translateY(-2px)}
.kpi.flat{cursor:default}.kpi.flat:hover{transform:none;border-color:var(--line)}
.kpi .l{color:var(--t3);font-size:12px;font-weight:600}.kpi .v{font-size:25px;font-weight:900;color:var(--navy2);line-height:1.15}.kpi .v.txt{font-size:17px}.kpi .s{font-size:11px;color:var(--t3)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(7,38,105,.04),0 8px 24px -16px rgba(7,38,105,.18)}
.card h2{margin-bottom:10px}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.two-e{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
th{color:var(--t3);font-size:12px;font-weight:700}
th button{background:none;border:0;font-weight:700;color:var(--t3);cursor:pointer;padding:0}
tr.click:hover{background:#f3f7ff;cursor:pointer}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:800}
.p-ok{background:#e9f5d6;color:var(--okt)}.p-nv{background:#e3ecff;color:var(--navy2)}.p-in{background:#ffe9d6;color:var(--ort)}.p-rm{background:#fde1df;color:var(--badt)}.p-gr{background:#edf0f6;color:var(--t2)}.p-at{background:#d9f3f9;color:#0b6a85}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;font-weight:700;cursor:pointer;color:var(--t2)}
.tab.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
label{display:block;font-weight:700;font-size:12px;color:var(--t2);margin-bottom:3px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid #c9d4ee;border-radius:10px;padding:7px 10px;background:#fff}
.err{color:var(--badt);font-size:12px;font-weight:600;margin-top:3px}
.fld{margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.muted{color:var(--t3)}
.hero{background:radial-gradient(1200px 500px at 80% -10%,#2a3fb0 0,transparent 60%),var(--navy);color:#fff;padding:48px 30px 40px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.hero h1{color:#fff;font-size:40px;font-weight:900;max-width:820px;line-height:1.12;margin-bottom:14px}
.hero p{color:#cdd9f7;max-width:700px;font-size:15px}
.badge-sim{display:inline-block;background:rgba(27,188,228,.12);color:#5fe3ff;border:1px solid rgba(95,227,255,.5);border-radius:999px;padding:4px 14px;font-weight:700;font-size:12px;margin-bottom:18px;letter-spacing:.02em;width:fit-content}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:24px}
.role{background:rgba(255,255,255,.96);color:var(--t1);border:0;border-radius:18px;padding:18px;text-align:left;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 18px 40px -24px rgba(0,0,0,.6)}
.role:hover{transform:translateY(-3px);box-shadow:0 0 0 2px var(--aqua),0 22px 44px -24px rgba(0,0,0,.7)}
.role b{color:var(--navy2);font-size:16px;display:block;margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:#e8eefc;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.warn{background:#fff3e6;border:1px solid var(--orange);border-radius:12px;padding:10px 12px;margin-bottom:12px;color:var(--ort);font-weight:600}
.bad{background:#fdeceb;border:1px solid var(--bad);border-radius:12px;padding:10px 12px;margin-bottom:12px;color:var(--badt);font-weight:600}
.okb{background:#eef7dd;border:1px solid var(--ok);border-radius:12px;padding:10px 12px;margin-bottom:12px;color:var(--okt);font-weight:600}
.info{background:#eef3ff;border:1px solid var(--blue3);border-radius:12px;padding:10px 12px;margin-bottom:12px;color:var(--navy2)}
.tl{border-left:2px solid var(--blue3);margin-left:6px;padding-left:12px}.tl div{margin-bottom:10px}
.overlay{position:fixed;inset:0;background:rgba(3,19,53,.55);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:#fff;border-radius:16px;padding:20px;max-width:580px;width:100%;max-height:90vh;overflow:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:#fff;z-index:40;box-shadow:-8px 0 30px rgba(3,19,53,.25);padding:20px;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;z-index:60;font-weight:600;max-width:90vw}
.toast.bad{background:var(--badt)}
.legend span{margin-right:12px;font-size:12px;color:var(--t2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.lrow{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff}
.lrow.flag{border-color:var(--orange);background:#fffaf5}
.lrow.done{border-color:var(--ok);background:#f8fcf1}
.why{background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:12px;color:var(--t2)}
.why b{color:var(--navy2)}
.seg{display:inline-flex;border:1px solid #c9d4ee;border-radius:999px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 14px;font-weight:700;font-size:12px;cursor:pointer;color:var(--t2)}
.seg button+button{border-left:1px solid #c9d4ee}
.seg button.on{background:var(--blue);color:#fff}
.seg button.on.neg{background:var(--bad)}
.seg button.on.mid{background:var(--orange)}
@media(max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}.rail{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;z-index:20;padding:6px;justify-content:flex-start}.rail .sp{display:none}.logo{display:none}.main{padding-bottom:84px}.top{position:static;padding:12px}.page{padding:14px 12px 30px}.hero{padding:32px 16px}.hero h1{font-size:27px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
'use strict';
/* ============================================================
   LOGIC LAYER (DOM-free): generator, rules, mutations, tests
   ============================================================ */
const SEED=20261111, ASOF_ISO='2026-11-11';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const toDay=iso=>{const [y,m,d]=iso.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const fromDay=n=>new Date(n*864e5).toISOString().slice(0,10);
const ASOF=toDay(ASOF_ISO);
function bizDays(fromIso,toIso){const a=toDay(fromIso),b=toDay(toIso);let c=0;for(let d=a+1;d<=b;d++){const w=new Date(d*864e5).getUTCDay();if(w!==0&&w!==6)c++}return c}
function npiValid(n){n=String(n);if(!/^\d{10}$/.test(n))return false;const s='80840'+n;let sum=0,alt=false;for(let i=s.length-1;i>=0;i--){let d=+s[i];if(alt){d*=2;if(d>9)d-=9}sum+=d;alt=!alt}return sum%10===0}
function npiMake(b9){for(let c=0;c<10;c++){const n=String(b9)+c;if(npiValid(n))return n}}
const DEF={cycle:90,pubDays:2,cap:100,high:50,med:25,
  w:{never:35,past:20,noclaims:30,dropped:25,addr:15,reported:25,many:15,npi:10}};
const WHY={never:'Never confirmed by the practice',past:'Past its 90-day verification window',
  noclaims:'No claims from this location in 14 months',dropped:'Absent from the practice’s last roster file',
  addr:'Address differs from the registry record',reported:'A member reported this listing unreachable',
  many:'Provider listed at four or more locations',npi:'NPI fails its check-digit test'};
const STATES=['CA','TX','FL','NY','PA','OH','IL','GA','NC','MI'];
const SPECS=['Cardiology','Primary Care','Pediatrics','Orthopedics','Dermatology','Behavioral Health','OB/GYN','Neurology','Oncology','Endocrinology'];
const FIRST=['Aisha','Rohan','Maria','James','Lena','Omar','Priya','Daniel','Chen','Sofia','Marcus','Hana','Luis','Nora','Victor','Elena','Samir','Grace','Tomas','Ivy'];
const LAST=['Rao','Nguyen','Alvarez','Brooks','Kim','Haddad','Patel','Foster','Zhou','Ricci','Walker','Sato','Gomez','Larsen','Mehta','Cole','Dubois','Okafor','Reyes','Hale'];
const PRAC=['Northgate Medical Group','Riverbend Health Partners','Summit Physicians','Harbor Care Associates','Pinecrest Clinics','Lakeside Medical','Cedar Valley Health','Ironwood Physicians','Bluebird Care Network','Granite Specialty Group','Meadowlark Family Care','Oakline Medical','Stonebridge Health','Fairmont Physicians','Willowbrook Care','Ashgrove Medical','Brightwater Clinics','Calder Health Group','Dunmore Physicians','Elmridge Medical'];
const STREET=['Maple','Oak','Cedar','Lake','Hill','Park','River','Birch','Elm','Juniper'];
const TOWN=['Fairview','Clifton','Georgetown','Salem','Milton','Ashland','Bedford','Dover','Kingston','Newport'];
const pad=(n,w)=>String(n).padStart(w,'0');
const fmtPhone=s=>{const d=String(s).replace(/\D/g,'');return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`};
const phoneOk=s=>String(s).replace(/\D/g,'').length===10&&/^[\d\s().+-]+$/.test(String(s));
const FOCAL='PR-01';

function generate(){
  const r=mulberry32(SEED);
  const ri=(a,b)=>a+Math.floor(r()*(b-a+1));
  const pick=a=>a[Math.floor(r()*a.length)];
  const practices=[],locations=[],providers=[],listings=[],reports=[];
  for(let i=1;i<=20;i++){
    const st=STATES[(i-1)%STATES.length];
    const p={id:'PR-'+pad(i,2),name:PRAC[i-1],tin:String(ri(100000000,999999999)),state:st,
      contact:`${pick(FIRST)} ${pick(LAST)}`,rosterAge:ri(5,210)};
    practices.push(p);
    const nloc=i===1?3:ri(1,4);
    for(let j=1;j<=nloc;j++){
      locations.push({id:p.id+'-L'+j,pid:p.id,
        name:`${TOWN[(i+j)%TOWN.length]} ${['Clinic','Office','Center','Annex'][j-1]||'Site'}`,
        addr:`${ri(10,9899)} ${pick(STREET)} ${pick(['St','Ave','Blvd','Rd'])}, ${TOWN[(i+j)%TOWN.length]} ${st}`,
        phone:fmtPhone(String(ri(201,989))+'555'+pad(ri(0,9999),4))});
    }
  }
  let pn=0;
  practices.forEach((p,pi)=>{
    const locs=locations.filter(l=>l.pid===p.id);
    const n=pi===0?14:ri(15,32);
    for(let k=0;k<n;k++){
      pn++;
      const base=String(ri(100000000,999999999));
      let npi=npiMake(base);
      if(r()<0.02){do{npi=base+ri(0,9)}while(npiValid(npi))}
      const prov={id:'P-'+pad(pn,4),pid:p.id,npi,name:`Dr ${pick(FIRST)} ${pick(LAST)}`,spec:pick(SPECS)};
      providers.push(prov);
      // group-level submission: some providers attached to every location
      const all=r()<0.22&&locs.length>=3;
      const mine=all?locs:locs.filter(()=>r()<0.6);
      const chosen=mine.length?mine:[locs[0]];
      chosen.forEach(l=>{
        const never=r()<0.14;
        const age=r()<0.52?ri(3,88):ri(91,300);
        listings.push({id:'LS-'+pad(listings.length+1,4),prov:prov.id,loc:l.id,pid:p.id,
          lastV:never?null:fromDay(ASOF-age),
          basis:never?'never':(r()<0.45?'attested':r()<0.6?'inferred':'carried'),
          claimsMo:all&&r()<0.7?ri(14,30):(r()<0.12?ri(14,26):ri(0,11)),
          dropped:r()<0.09,addrMism:r()<0.11,reported:r()<0.07,
          status:'listed',confirmedAt:null,pubAt:null,hist:[]});
      });
    }
  });
  // fixed, named cases on the focal practice so the walkthrough is reliable
  const F=listings.filter(l=>l.pid===FOCAL);
  const setL=(ix,o)=>{if(F[ix])Object.assign(F[ix],{dropped:false,addrMism:false,reported:false,hist:[]},o)};
  setL(0,{lastV:fromDay(ASOF-20),basis:'attested',claimsMo:1});
  setL(1,{lastV:fromDay(ASOF-140),basis:'carried',claimsMo:16});
  setL(2,{lastV:null,basis:'never',claimsMo:3});
  setL(3,{lastV:fromDay(ASOF-96),basis:'inferred',claimsMo:18,dropped:true});
  setL(4,{lastV:fromDay(ASOF-60),basis:'attested',claimsMo:17,addrMism:true});
  setL(5,{lastV:fromDay(ASOF-110),basis:'carried',claimsMo:20,reported:true});
  F.slice(6).forEach((l,i)=>{if(i%3!==0){l.lastV=fromDay(ASOF-ri(5,70));l.basis=r()<0.6?'attested':'carried';l.claimsMo=ri(0,6);l.dropped=false;l.addrMism=false;l.reported=false}});
  listings.forEach(l=>{if(l.lastV)l.hist.push({date:l.lastV,kind:'verification',basis:l.basis,text:'Recorded in the plan’s roster pipeline'})});
  for(let k=1;k<=70;k++){
    const l=listings[Math.floor(r()*listings.length)];
    reports.push({id:'MR-'+pad(k,3),ls:l.id,date:fromDay(ASOF-ri(0,150)),
      reason:['Phone not answered','Provider not at this address','Not accepting new patients','No longer in network'][Math.floor(r()*4)],
      open:r()<0.55});
  }
  return {practices,locations,providers,listings,reports};
}
const ageOf=l=>l.lastV?ASOF-toDay(l.lastV):null;
const overdue=(l,s)=>{const a=ageOf(l);return a===null||a>s.cycle};
function locCount(S,provId){return S.listings.filter(l=>l.prov===provId&&l.status==='listed').length}
function flagsOf(S,l){
  const s=S.set,out=[],a=ageOf(l);
  if(a===null)out.push(['never',s.w.never]);else if(a>s.cycle)out.push(['past',s.w.past]);
  if(l.claimsMo>=14)out.push(['noclaims',s.w.noclaims]);
  if(l.dropped)out.push(['dropped',s.w.dropped]);
  if(l.addrMism)out.push(['addr',s.w.addr]);
  if(l.reported)out.push(['reported',s.w.reported]);
  if(locCount(S,l.prov)>=4)out.push(['many',s.w.many]);
  const p=S.providers.find(x=>x.id===l.prov);
  if(p&&!npiValid(p.npi))out.push(['npi',s.w.npi]);
  return out}
function suspicion(S,l){const f=flagsOf(S,l);const raw=f.reduce((t,x)=>t+x[1],0);return {raw,total:Math.min(raw,S.set.cap),flags:f}}
function confidence(S,l){const a=ageOf(l);
  const sig=[a!==null&&a<=S.set.cycle, l.claimsMo<12, !l.dropped&&!l.addrMism, !l.reported].filter(Boolean).length;
  return {n:sig,label:sig>=3?'High':sig===2?'Medium':'Low'}}
const BASIS={attested:'Attested by the practice',inferred:'Inferred from claims activity',carried:'Carried over from a roster file',never:'Never verified'};
function listed(S){return S.listings.filter(l=>l.status==='listed')}
function pubLagHours(l){if(!l.confirmedAt||!l.pubAt)return null;return (l.pubAt-l.confirmedAt)/36e5}
function metrics(S,rows){
  rows=rows||listed(S);
  const ids=new Set(rows.map(l=>l.id));
  let inCycle=0,past=0,attested=0;
  rows.forEach(l=>{const a=ageOf(l);if(a!==null&&a<=S.set.cycle)inCycle++;else past++;if(l.basis==='attested')attested++});
  const open=S.reports.filter(r=>r.open&&ids.has(r.ls)).length;
  const lags=rows.map(pubLagHours).filter(x=>x!==null).sort((a,b)=>a-b);
  const med=lags.length?(lags.length%2?lags[(lags.length-1)/2]:(lags[lags.length/2-1]+lags[lags.length/2])/2):null;
  return {n:rows.length,inCycle,past,attested,open,
    inCyclePct:rows.length?inCycle/rows.length*100:0,
    attestedPct:rows.length?attested/rows.length*100:0,
    retired:S.retired,locFixes:S.locFixes,medLag:med}}
function basisCounts(S,rows){const o={attested:0,inferred:0,carried:0,never:0};rows.forEach(l=>{o[l.basis]++});return o}
function trend(S,rows){const out=[];
  for(let k=5;k>=0;k--){const d=ASOF-30*k;let cur=0;
    rows.forEach(l=>{let last=null;l.hist.forEach(h=>{if(h.kind==='verification'){const x=toDay(h.date);if(x<=d&&(last===null||x>last))last=x}});
      if(last!==null&&d-last<=S.set.cycle)cur++});
    out.push({date:fromDay(d),pct:rows.length?cur/rows.length*100:0})}
  return out}
function queue(S,rows){
  return rows.map(l=>{const s=suspicion(S,l),a=ageOf(l);
    const windowPos=a===null?999:a-S.set.cycle;
    return {l,score:s.total,flags:s.flags,age:a,windowPos,
      rank:windowPos*2+s.total}})
    .sort((x,y)=>y.rank-x.rank||(x.l.id<y.l.id?-1:1))}

function validateConfirm(f,ctx){const e={};
  if(!['confirm','correct','remove'].includes(f.action))e.action='Choose confirm, correct or remove.';
  if(f.action==='correct'){
    if(!f.phone&&!f.addr)e.correct='Change at least one field, or choose confirm instead.';
    if(f.phone&&!phoneOk(f.phone))e.phone='Enter a valid 10-digit phone, for example (415) 555-0134.';
    if(f.addr&&String(f.addr).trim().length<6)e.addr='Enter the full corrected address.';
  }
  if(f.action==='remove'&&!String(f.reason||'').trim())e.reason='Say why this provider is no longer at this location.';
  if(ctx&&ctx.onlyLocation&&f.action==='remove')e.action='This is the provider’s only remaining location. Removing it would delist them entirely; contact the plan instead.';
  return e}
function applyConfirm(S,lsId,f){
  const l=S.listings.find(x=>x.id===lsId);
  const only=S.listings.filter(x=>x.prov===l.prov&&x.status==='listed').length<=1;
  const errors=validateConfirm(f,{onlyLocation:only});
  if(Object.keys(errors).length)return {ok:false,errors};
  const loc=S.locations.find(x=>x.id===l.loc);
  const now=Date.now();
  l.confirmedAt=now; l.pubAt=now+36e5*(1+Math.floor(mulberry32(hashStr(l.id))()*20));
  l.lastV=ASOF_ISO; l.basis='attested'; l.dropped=false; l.reported=false;
  S.reports.forEach(r=>{if(r.ls===l.id&&r.open)r.open=false});
  let text='';
  if(f.action==='confirm'){text='Practice confirmed this listing as correct';l.claimsMo=Math.min(l.claimsMo,11)}
  if(f.action==='correct'){
    const bits=[];
    if(f.phone){loc.phone=fmtPhone(f.phone);bits.push('phone')}
    if(f.addr){loc.addr=String(f.addr).trim();l.addrMism=false;bits.push('address')}
    text='Practice corrected '+bits.join(' and ');
    l.claimsMo=Math.min(l.claimsMo,11);
  }
  if(f.action==='remove'){
    l.status='removed'; S.locFixes++;
    text='Practice removed this provider from this location: '+String(f.reason).trim();
  }
  S.retired++;
  l.hist.push({date:ASOF_ISO,kind:f.action==='remove'?'removal':'confirmation',basis:'attested',text});
  S.audit.push({t:now,ls:l.id,who:S.ui.actor||'Practice manager',action:f.action,text});
  return {ok:true,action:f.action}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function resetAll(){return freshState()}

/* ---------------- self tests ---------------- */
function runTests(){
  const R=[];const T=(id,name,fn)=>{let ok=false,msg='';try{const v=fn();ok=v===true;msg=ok?'':String(v)}catch(e){msg=e.message}R.push({id,name,ok,msg})};
  const S0=freshState();
  const F=()=>S0.listings.filter(l=>l.pid===FOCAL);
  const good={action:'confirm'};
  T('T1','Dataset: 20 practices, 480+ providers, every provider has a listing',()=>
    S0.practices.length===20 && S0.providers.length>=400 &&
    S0.providers.every(p=>S0.listings.some(l=>l.prov===p.id)));
  T('T2','Generator is deterministic for the seed',()=>JSON.stringify(generate())===JSON.stringify(generate()));
  T('T3','Focal listing 1 is inside its 90-day window',()=>{const l=F()[0];return ageOf(l)===20&&!overdue(l,S0.set)});
  T('T4','Focal listing 2 is past the window at 140 days',()=>{const l=F()[1];return ageOf(l)===140&&overdue(l,S0.set)});
  T('T5','Never-verified listing scores the never weight',()=>{const l=F()[2];const s=suspicion(S0,l);
    return l.lastV===null&&s.flags.some(f=>f[0]==='never')&&s.total>=S0.set.w.never});
  T('T6','Dropped-from-roster listing raises both past-window and dropped flags',()=>{const l=F()[3];
    const k=suspicion(S0,l).flags.map(f=>f[0]);return k.includes('past')&&k.includes('dropped')&&k.includes('noclaims')});
  T('T7','Address mismatch and no claims both fire',()=>{const l=F()[4];
    const k=suspicion(S0,l).flags.map(f=>f[0]);return k.includes('addr')&&k.includes('noclaims')});
  T('T8','Member-reported listing raises the reported flag',()=>{const l=F()[5];
    return suspicion(S0,l).flags.map(f=>f[0]).includes('reported')});
  T('T9','Suspicion is capped at the cap',()=>{const S=structuredClone(S0);const l=S.listings[0];
    Object.assign(l,{lastV:null,claimsMo:20,dropped:true,addrMism:true,reported:true});
    const s=suspicion(S,l);return s.raw>=S.set.cap?s.total===S.set.cap:s.total===s.raw});
  T('T10','Confidence falls as signals fail',()=>{const S=structuredClone(S0);const l=S.listings[0];
    Object.assign(l,{lastV:fromDay(ASOF-10),claimsMo:1,dropped:false,addrMism:false,reported:false});
    if(confidence(S,l).label!=='High')return 'expected High';
    Object.assign(l,{lastV:null,claimsMo:20,reported:true});
    return confidence(S,l).label==='Low'});
  T('T11','Business days: Friday to Monday is 1',()=>bizDays('2026-11-06','2026-11-09')===1);
  T('T12','NPI check digit accepts a valid NPI and rejects a bad one',()=>npiValid('1234567893')&&!npiValid('1234567890'));
  T('T13','Confirming raises verified-in-cycle and sets the basis to attested',()=>{
    const S=structuredClone(S0);const l=S.listings.find(x=>x.pid===FOCAL&&overdue(x,S.set));
    const before=metrics(S).inCycle;const r=applyConfirm(S,l.id,good);
    return r.ok&&metrics(S).inCycle===before+1&&l.basis==='attested'&&l.lastV===ASOF_ISO});
  T('T14','Validation rejects a malformed corrected phone',()=>
    !!validateConfirm({action:'correct',phone:'12-34'},null).phone);
  T('T15','Validation rejects a correction that changes nothing',()=>
    !!validateConfirm({action:'correct'},null).correct);
  T('T16','Validation requires a reason to remove',()=>
    !!validateConfirm({action:'remove',reason:'  '},null).reason);
  T('T17','Removing the only remaining location is blocked',()=>
    !!validateConfirm({action:'remove',reason:'left'},{onlyLocation:true}).action);
  T('T18','Removing an attachment delists it and counts a location fix',()=>{
    const S=structuredClone(S0);
    const l=S.listings.find(x=>S.listings.filter(y=>y.prov===x.prov&&y.status==='listed').length>1);
    const before=listed(S).length;
    const r=applyConfirm(S,l.id,{action:'remove',reason:'Moved to another site'});
    return r.ok&&listed(S).length===before-1&&S.locFixes===1});
  T('T19','A correction writes the new phone through to the location',()=>{
    const S=structuredClone(S0);const l=S.listings[0];
    applyConfirm(S,l.id,{action:'correct',phone:'4155550134'});
    return S.locations.find(x=>x.id===l.loc).phone==='(415) 555-0134'});
  T('T20','Confirming closes any open member report on that listing',()=>{
    const S=structuredClone(S0);const rep=S.reports.find(r=>r.open);
    applyConfirm(S,rep.ls,good);
    return S.reports.filter(r=>r.ls===rep.ls&&r.open).length===0});
  T('T21','Publication lag is recorded and within the two-day rule',()=>{
    const S=structuredClone(S0);const l=S.listings[0];applyConfirm(S,l.id,good);
    const h=pubLagHours(l);return h!==null&&h>0&&h<=48});
  T('T22','Queue ranks a never-verified listing above one inside its window',()=>{
    const S=structuredClone(S0);const q=queue(S,listed(S));
    const first=q[0],last=q[q.length-1];
    return first.rank>=last.rank&&(first.age===null||first.age>S.set.cycle)});
  T('T23','Trend ends at the current verified-in-cycle share',()=>{
    const rows=listed(S0);return Math.abs(trend(S0,rows)[5].pct-metrics(S0,rows).inCyclePct)<1e-9});
  T('T24','Group-level submission exists in the data: some providers sit at 4+ locations',()=>
    S0.providers.some(p=>locCount(S0,p.id)>=4));
  T('T25','Every audit entry names an action and a listing',()=>{
    const S=structuredClone(S0);applyConfirm(S,S.listings[0].id,good);
    return S.audit.length===1&&!!S.audit[0].ls&&!!S.audit[0].action});
  return R}

function donut(c){

    const s=`<circle cx="50" cy="50" r="38" fill="none" stroke="${cols[k]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=len;return s}).join('');
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
  <svg width="130" height="130" viewBox="0 0 100 100" role="img" aria-label="Listings by basis">${arcs}<text x="50" y="54" text-anchor="middle" font-size="13" font-weight="900" fill="#072669">${tot}</text></svg>
  <div class="legend" style="display:grid;gap:4px">${Object.keys(c).map(k=>`<span><i style="background:${cols[k]}"></i>${esc(BASIS[k])}: <b>${c[k]}</b> (${pc(c[k]/tot*100)})</span>`).join('')}</div></div>`}

  const pts=t.map((x,i)=>`${16+i*56+bw/2},${98-x.pct/100*84}`).join(' ');
  return `<svg viewBox="0 0 352 120" width="100%" role="img" aria-label="Verified in cycle over six months, now ${Math.round(t[5].pct)} percent">${bars}<polyline points="${pts}" fill="none" stroke="#072669" stroke-width="2"/></svg>`}
function vDash(){

    <div class="card"><h2>Verified in cycle, last six months</h2>${trendSvg(trend(S,rows))}

  </div>
  <div class="card"><h2>Where the exposure sits</h2>
  <div class="scroll"><table><thead><tr><th>Practice</th><th>Listings</th><th>Verified in cycle</th><th>Past window</th><th>Open reports</th></tr></thead><tbody>
  ${S.practices.map(p=>{const r=rows.filter(l=>l.pid===p.id);const mm=metrics(S,r);return {p,mm}})

function vQueue(){
  const rows=planRows();const q=queue(S,rows);
  const per=25,pages=Math.max(1,Math.ceil(q.length/per));S.ui.page=Math.min(S.ui.page,pages-1);

  return header('Verification queue','Ranked by position in each listing’s own 90-day window, then by what looks wrong')+`<div class="page">
  <div class="card">
  <div class="row" style="margin-bottom:10px">
    <form data-f="q" class="fld" style="min-width:220px;margin:0"><label for="qq">Search provider, NPI, specialty or site</label><input id="qq" type="text" value="${esc(S.ui.q)}"></form>
    <div class="tabs" style="margin:0">${FILT.map(f=>`<button class="tab ${S.ui.filter===f[0]?'on':''}" data-a="filt" data-v="${f[0]}">${f[1]}</button>`).join('')}</div>
    <button class="btn sm" data-a="csv">Export CSV</button>
    <span class="muted">${q.length} listings</span>
  </div>
  <div class="scroll"><table><thead><tr><th>Provider</th><th>Practice</th><th>Location</th><th>Days since verified</th><th>Window</th><th>Score</th><th>Basis</th><th>Why</th></tr></thead><tbody>
  ${vis.map(x=>{const l=x.l,p=provOf(l.prov);
    return `<tr class="click" data-a="popen" data-v="${l.id}"><td>${esc(p.name)}<div class="muted" style="font-size:11px">${esc(p.spec)}</div></td>
    <td>${esc(practiceOf(l.pid).name)}</td><td>${esc(locOf(l.loc).name)}</td>
    <td>${x.age===null?'Never':x.age}</td>
    <td>${x.windowPos>0?`<span class="pill p-rm">${x.windowPos===999?'n/a':'+'+x.windowPos+'d over'}</span>`:`<span class="pill p-ok">${-x.windowPos}d left</span>`}</td>
    <td><b>${x.score}</b></td><td><span class="pill p-gr">${l.basis}</span></td>
    <td style="white-space:normal;max-width:280px">${x.flags.slice(0,2).map(f=>esc(WHY[f[0]])).join('; ')}${x.flags.length>2?'; +'+(x.flags.length-2)+' more':''}</td></tr>`}).join('')

  </tbody></table></div>
  <div class="row" style="margin-top:10px"><button class="btn sm" data-a="page" data-v="-1" ${S.ui.page===0?'disabled':''}>Previous</button><span>Page ${S.ui.page+1} of ${pages}</span><button class="btn sm" data-a="page" data-v="1" ${S.ui.page>=pages-1?'disabled':''}>Next</button></div>
  </div></div>`}

function vPlanRecord(){

   <span class="pill p-gr">Score ${x.total}</span><span class="pill p-gr">Confidence ${cf.label}</span>
   <span class="pill p-at">${esc(BASIS[l.basis])}</span></p>
  ${overdue(l,S.set)?`<div class="bad">Past its 90-day window${ageOf(l)===null?' and never verified':' by '+(ageOf(l)-S.set.cycle)+' days'}. Under the No Surprises Act an unverifiable listing must be removed until it can be confirmed.</div>`:''}

    <div class="card"><h2>Why this is ranked here</h2>
    ${x.flags.length?x.flags.map(f=>`<div style="display:flex;justify-content:space-between"><span>${esc(WHY[f[0]])}</span><b>+${f[1]}</b></div><div class="bar"><i style="width:${f[1]/S.set.cap*100}%"></i></div>`).join(''):'<span class="muted">Nothing fires on this listing.</span>'}
    <div style="margin-top:8px"><b>Total ${x.total}</b>${x.raw>x.total?` (raw ${x.raw}, capped at ${S.set.cap})`:''}</div></div>
    <div class="card"><h2>Record, with the basis of each field</h2>
    <table><tbody>
      <tr><th scope="row">NPI</th><td>${esc(p.npi)} <span class="pill p-gr">registry</span></td></tr>
      <tr><th scope="row">Specialty</th><td>${esc(p.spec)} <span class="pill p-gr">roster file</span></td></tr>
      <tr><th scope="row">Address</th><td style="white-space:normal">${esc(lo.addr)} <span class="pill ${l.addrMism?'p-in':'p-gr'}">${l.addrMism?'differs from registry':'matches registry'}</span></td></tr>
      <tr><th scope="row">Phone</th><td>${esc(lo.phone)} <span class="pill p-gr">roster file</span></td></tr>

    <div class="card"><h2>Audit trail</h2><div class="tl">${[...l.hist].reverse().map(h=>`<div><b>${h.date}</b> <span class="pill p-gr">${esc(h.kind)}</span> ${h.basis?`<span class="pill p-at">${esc(h.basis)}</span>`:''}<br>${esc(h.text)}</div>`).join('')||'<span class="muted">No entries</span>'}</div></div>
  </div></div>`}

function vAudit(){
  const rows=listed(S);
  const checks=[['Every listing inside its 90-day window',metrics(S,rows).past===0,metrics(S,rows).past+' past window'],
    ['At least 85% of listings verified in cycle',metrics(S,rows).inCyclePct>=85,pc(metrics(S,rows).inCyclePct)],
    ['No open member report older than 30 days',S.reports.filter(r=>r.open&&ASOF-toDay(r.date)>30).length===0,S.reports.filter(r=>r.open&&ASOF-toDay(r.date)>30).length+' open'],
    ['No provider listed at four or more sites without claims at each',!rows.some(l=>locCount(S,l.prov)>=4&&l.claimsMo>=14),'the group-level pattern CMS flagged'],
    ['Every confirmation published inside two business days',rows.filter(l=>l.confirmedAt).every(l=>{const h=pubLagHours(l);return h===null||h<=48}),'checked per confirmation'],
    ['Every verified listing carries a dated trail entry',rows.every(l=>!l.lastV||l.hist.some(h=>h.date===l.lastV)),'checked per listing']];
  return header('Audit pack','Evidence for the directory attestation')+`<div class="page">
  <div class="grid two-e">
  <div class="card"><h2>Readiness checks</h2>
    <p class="muted">Internal targets, editable in Settings. Not regulatory thresholds and not a compliance determination.</p>
    ${checks.map(c=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span class="pill ${c[1]?'p-ok':'p-rm'}">${c[1]?'Pass':'Fail'}</span><span>${c[0]}</span><span class="muted">(${c[2]})</span></div>`).join('')}
    <p><b>${checks.filter(c=>c[1]).length} of ${checks.length} checks pass.</b></p></div>
  <div class="card"><h2>Confirmation log</h2>
    ${S.audit.length?`<div class="scroll" style="max-height:360px;overflow:auto"><table><thead><tr><th>Listing</th><th>Who</th><th>Action</th><th>What</th></tr></thead><tbody>
    ${[...S.audit].reverse().map(a=>`<tr><td>${esc(a.ls)}</td><td>${esc(a.who)}</td><td><span class="pill p-at">${esc(a.action)}</span></td><td style="white-space:normal">${esc(a.text)}</td></tr>`).join('')}
    </tbody></table></div><button class="btn sm" data-a="csvaudit" style="margin-top:10px">Export log</button>`
    :'<p class="muted">No confirmations yet. Work a listing from the provider side and it appears here.</p>'}</div>
  </div></div>`}

function vIns(){
  const tr=S.results;const med=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
  const ms=med(tr.map(t=>t.steps)),mt=med(tr.map(t=>t.secs));const BASE=9;
  return header('Insights','Measured from your own use of this app')+`<div class="page">
  <div class="grid kpis">
    <div class="kpi flat"><div class="l">Confirmations completed</div><div class="v">${tr.length}</div></div>
    <div class="kpi flat"><div class="l">Median steps</div><div class="v">${ms===null?'-':ms}</div><div class="s">Clicks from roster to submitted</div></div>
    <div class="kpi flat"><div class="l">Median time</div><div class="v">${mt===null?'-':mt.toFixed(0)+'s'}</div><div class="s">Target is under 5 minutes</div></div>
    <div class="kpi flat"><div class="l">Assumed manual baseline</div><div class="v">${BASE} steps</div><div class="s">Assumption, not measured</div></div>

  <div class="card"><h2>Before and after</h2>
  ${ms===null?'<p class="muted">Confirm a listing from the practice side to see your own step count and time here.</p>'
  :`<p>Your median is <b>${ms}</b> steps against an assumed baseline of <b>${BASE}</b> for the email-and-phone path: ${ms<BASE?`${BASE-ms} fewer`:ms===BASE?'the same number of':`${ms-BASE} more`} steps per listing. The baseline is an assumption to be replaced with a timed study; the in-app figure is measured from this session.</p>
  <div class="scroll"><table><thead><tr><th>#</th><th>Listing</th><th>Action</th><th>Steps</th><th>Seconds</th></tr></thead><tbody>
  ${tr.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.ls)}</td><td>${esc(t.action)}</td><td>${t.steps}</td><td>${t.secs.toFixed(0)}</td></tr>`).join('')}</tbody></table></div>`}
  </div></div>`}

function vSet(){

  <div class="card"><h2>Rules</h2><form data-f="set" novalidate>

    <p class="muted">Runs 25 checks of the rules and calculations in your browser.</p>
    <button class="btn solid" data-a="tests">Run self-tests</button>
    ${t?`<p><b>${t.filter(x=>x.ok).length} of ${t.length} passed.</b></p>${t.map(x=>`<div><span class="pill ${x.ok?'p-ok':'p-rm'}">${x.ok?'Pass':'Fail'}</span> ${x.id} ${esc(x.name)} ${x.msg?'<span class="err">'+esc(x.msg)+'</span>':''}</div>`).join('')}`:''}
  </div></div></div>`}

function drawer(){if(!S.ui.drawer)return '';
  return `<aside class="drawer" role="dialog" aria-label="About this prototype">
  <div class="row" style="justify-content:space-between"><h2>About</h2><button class="btn sm" data-a="drawer">Close</button></div>
  <h3 style="margin-top:12px">What it computes</h3>
  <p>Flag detection and its explanations, the suspicion score and confidence banding, queue ranking by each listing's own window position, the 90-day and two-business-day arithmetic, every KPI, chart and readiness check, the audit trail, field validation, and the effect of each confirmation on everything downstream.</p>
  <h3>Rules in force</h3>
  <p>Verification cycle ${S.set.cycle} days. Publication limit ${S.set.pubDays} business days after a confirmation. High risk at ${S.set.high} and above. All editable in Settings.</p>

  <p>Claims activity, registry comparisons and member reports stand in for MedCare's production signals, and no email or call leaves the app. All 20 practices, ${S.listings.length} listings and ${S.reports.length} member reports are generated from a fixed seed with an as-of date of ${ASOF_ISO}.</p>
  <h3>Why both sides are here</h3>

function dialog(){const d=S.ui.dialog;if(!d)return '';

function render(){
  const sc=S.ui.screen;
  if(sc==='start'){$('app').innerHTML=vStart()+dialog();return}

  <main class="main">${body}</main></div>${drawer()}${dialog()}${S.ui.toast?`<div class="toast ${S.ui.toast.bad?'bad':''}" role="status">${esc(S.ui.toast.msg)}</div>`:''}`;

function csvQueue(){const q=queue(S,planRows());const qt=v=>'"'+String(v).replace(/"/g,'""')+'"';
  return ['listing,provider,npi,specialty,practice,location,days_since_verified,window_days_over,score,basis,flags']

      return [x.l.id,p.name,p.npi,p.spec,practiceOf(x.l.pid).name,locOf(x.l.loc).name,
        x.age===null?'never':x.age,x.windowPos>0?x.windowPos:0,x.score,x.l.basis,
        x.flags.map(f=>WHY[f[0]]).join(' | ')].map(qt).join(',')})).join('\n')}
function csvAudit(){const qt=v=>'"'+String(v).replace(/"/g,'""')+'"';
  return ['listing,who,action,detail'].concat(S.audit.map(a=>[a.ls,a.who,a.action,a.text].map(qt).join(','))).join('\n')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
  switch(a){
    case 'role':{S.ui.side=v==='practice'?'practice':'plan';
      S.ui.actor=v==='practice'?'Practice manager, Northgate':v==='ops'?'Network operations':'Compliance';
      S.ui.screen=v==='practice'?'roster':v==='ops'?'queue':'dash';
      if(v==='ops')S.ui.filter='past';
      log(true);render();window.scrollTo(0,0);break}
    case 'switch':S=Object.assign(S,{ui:Object.assign(S.ui,{screen:'start',side:null,sel:null,form:null})});render();break;
    case 'nav':go(v);break;
    case 'open':S.ui.sel=v;S.ui.form=null;S.task={start:Date.now(),steps:1};S.ui.screen='confirm';render();window.scrollTo(0,0);break;
    case 'popen':S.ui.sel=v;S.ui.screen='precord';log(true);render();window.scrollTo(0,0);break;
    case 'act':S.ui.form.action=v;S.ui.form.errors={};log(true);render();break;
    case 'toggleclean':S.ui.showClean=!S.ui.showClean;render();break;
    case 'filt':S.ui.filter=v;S.ui.page=0;S.ui.screen='queue';log(true);render();break;
    case 'qpractice':S.ui.q=practiceOf(v).name;S.ui.filter='';S.ui.page=0;S.ui.screen='queue';log(true);render();break;
    case 'page':S.ui.page+=+v;render();break;
    case 'csv':S.ui.dialog={title:'Queue export',html:`<p class="muted">Downloads are not available in this frame. Copy the text below.</p><textarea rows="8" readonly id="csvbox">${esc(csvQueue())}</textarea><button class="btn sm" data-a="copycsv">Copy</button>`};render();break;
    case 'csvaudit':S.ui.dialog={title:'Confirmation log export',html:`<p class="muted">Copy the text below.</p><textarea rows="8" readonly id="csvbox">${esc(csvAudit())}</textarea><button class="btn sm" data-a="copycsv">Copy</button>`};render();break;
    case 'copycsv':{try{navigator.clipboard.writeText($('csvbox').value).then(()=>toast('Copied.'),()=>{$('csvbox').select();toast('Select the text and copy it.',true)})}catch(x){$('csvbox').select();toast('Select the text and copy it.',true)}break}
    case 'resetask':S.ui.dialog={title:'Reset all data?',msg:'This discards every confirmation made in this session and restores the seeded dataset.',act:'reset',label:'Reset data'};render();break;
    case 'cancel':S.ui.dialog=null;render();break;
    case 'cfm':{const d=S.ui.dialog;S.ui.dialog=null;
      if(d.act==='reset'){S=resetAll();S.ui.screen='set';S.ui.side='plan';S.ui.actor='Compliance';toast('Data reset to the seeded dataset.')}
      render();break}
    case 'tests':S.ui.tests=runTests();render();break;
    case 'setdef':S.set=JSON.parse(JSON.stringify(DEF));S.ui.setErr=null;S.ui.pendingSet=null;toast('Default rules restored.');render();break;
    case 'drawer':S.ui.drawer=!S.ui.drawer;render();break;
  }});
document.addEventListener('change',e=>{const t=e.target.closest('[data-c]');if(!t)return;const c=t.dataset.c,k=t.dataset.k;
  if(c==='f'){S.ui.form[k]=t.value}
  else if(c==='set'){S.ui.pendingSet=S.ui.pendingSet||{};S.ui.pendingSet[k]=t.value}});
document.addEventListener('input',e=>{const t=e.target.closest('[data-c="f"],[data-c="set"]');if(!t)return;
  if(t.dataset.c==='f')S.ui.form[t.dataset.k]=t.value;
  else{S.ui.pendingSet=S.ui.pendingSet||{};S.ui.pendingSet[t.dataset.k]=t.value}});
document.addEventListener('submit',e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();
  if(f==='confirm'){
    const id=S.ui.sel,F=S.ui.form;const r=applyConfirm(S,id,F);
    if(!r.ok){F.errors=r.errors;toast('Fix the highlighted fields to submit.',true);render();return}
    const secs=(Date.now()-(S.task.start||Date.now()))/1000;
    S.results.push({ls:id,action:r.action,steps:S.task.steps,secs});S.task={start:null,steps:0};
    toast(r.action==='remove'?'Removed from that location. The plan sees it immediately.':'Thank you. The directory updates within two business days.');
    S.ui.screen='roster';S.ui.form=null;render();window.scrollTo(0,0)}
  else if(f==='q'){S.ui.q=$('qq').value;S.ui.page=0;render()}
  else if(f==='set'){
    const pend=S.ui.pendingSet||{},err={},ns=JSON.parse(JSON.stringify(S.set));
    Object.keys(pend).forEach(k=>{const v=Number(pend[k]);
      const lim=k==='cycle'?[1,730]:k==='pubDays'?[0,30]:k==='high'?[1,100]:[0,100];
      if(pend[k]===''||!Number.isFinite(v)||!Number.isInteger(v)||v<lim[0]||v>lim[1]){err[k]=`Enter a whole number from ${lim[0]} to ${lim[1]}.`;return}
      if(k.startsWith('w.'))ns.w[k.slice(2)]=v;else ns[k]=v});
    if(Object.keys(err).length){S.ui.setErr=err;toast('Fix the highlighted settings.',true);render();return}
    S.set=ns;S.ui.setErr=null;S.ui.pendingSet=null;toast('Settings applied. Scores and queue recomputed.');render()}});
render();
window.__DEMO={get S(){return S},runTests,generate,freshState,suspicion,metrics,queue,applyConfirm,validateConfirm,listed,render};
</script>
