<style>
:root{--navy:#031335;--navy2:#072669;--blue:#2a6af1;--blue2:#5386f4;--blue3:#a9c2f9;--aqua:#1bbce4;--purple:#7034ea;--orange:#ec700a;--t1:#29303d;--t2:#465167;--t3:#5a6884;--bg:#f5f6fa;--card:#fff;--ok:#73b124;--bad:#e25f5a;--line:#e2e8f7;--okt:#4a7a0a;--badt:#b3302b;--ort:#a84d00}

.src{font-size:11px;color:var(--t3)}
.diffadd{background:#e9f5d6}.diffchg{background:#ffe9d6}.diffdel{background:#fde1df}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.feed{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:#071a3d;color:#cfe0ff;border-radius:12px;padding:12px;max-height:300px;overflow:auto}
.feed div{margin-bottom:5px;white-space:pre-wrap;word-break:break-word}
@media(max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}.rail{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;z-index:20;padding:6px;justify-content:flex-start}.rail .sp{display:none}.logo{display:none}.main{padding-bottom:84px}.top{position:static;padding:12px}.page{padding:14px 12px 30px}.hero{padding:32px 16px}.hero h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
'use strict';
/* ==========================================================
   LOGIC LAYER (DOM-free)
   ========================================================== */
const SEED=20261111, ASOF_ISO='2026-11-11';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const toDay=iso=>{const [y,m,d]=String(iso).split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const fromDay=n=>new Date(n*864e5).toISOString().slice(0,10);
const ASOF=toDay(ASOF_ISO);
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''))&&!isNaN(Date.parse(s));
function bizDays(a,b){let c=0;for(let d=a+1;d<=b;d++){const w=new Date(d*864e5).getUTCDay();if(w!==0&&w!==6)c++}return c}
function npiValid(n){n=String(n);if(!/^\d{10}$/.test(n))return false;const s='80840'+n;let sum=0,alt=false;
  for(let i=s.length-1;i>=0;i--){let d=+s[i];if(alt){d*=2;if(d>9)d-=9}sum+=d;alt=!alt}return sum%10===0}
function npiMake(b9){for(let c=0;c<10;c++){const n=String(b9)+c;if(npiValid(n))return n}}
const pad=(n,w)=>String(n).padStart(w,'0');
const fmtPhone=s=>{const d=String(s).replace(/\D/g,'');return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:String(s)};
const phoneOk=s=>String(s).replace(/\D/g,'').length===10;
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');

const TAXONOMY={'207RC0000X':'Cardiovascular Disease','208D00000X':'General Practice','208000000X':'Pediatrics',
  '207X00000X':'Orthopaedic Surgery','207N00000X':'Dermatology','103T00000X':'Psychologist',
  '207V00000X':'Obstetrics & Gynecology','2084N0400X':'Neurology','207RX0202X':'Medical Oncology','207RE0101X':'Endocrinology'};
const TAX_CODES=Object.keys(TAXONOMY);
const PANEL=['accepting','not_accepting','existing_only'];
const FIRST=['Aisha','Rohan','Maria','James','Lena','Omar','Priya','Daniel','Chen','Sofia','Marcus','Hana','Luis','Nora','Victor','Elena','Samir','Grace','Tomas','Ivy','Noah','Ruth','Kiran','Paulo'];
const LAST=['Rao','Nguyen','Alvarez','Brooks','Kim','Haddad','Patel','Foster','Zhou','Ricci','Walker','Sato','Gomez','Larsen','Mehta','Cole','Dubois','Okafor','Reyes','Hale','Baptiste','Novak','Iyer','Mensah'];
const PRACTICES=['Northgate Medical Group','Riverbend Health Partners','Summit Physicians','Harbor Care Associates','Pinecrest Clinics','Lakeside Medical','Cedar Valley Health','Ironwood Physicians','Bluebird Care Network','Granite Specialty Group','Meadowlark Family Care','Oakline Medical'];
const STREET=['Maple','Oak','Cedar','Lake','Hill','Park','River','Birch'];
const TOWN=['Fairview','Clifton','Georgetown','Salem','Milton','Ashland','Bedford','Dover'];
const STATES=['CA','TX','FL','NY','PA','OH'];
const FOCAL='SUB-01';

/* ---- validation rule catalogue: every finding is explainable ---- */
const RULES={
  npi_format:{sev:'error',label:'NPI fails the check-digit test',src:'NPI standard, Luhn over the 80840 prefix',conf:'High'},
  npi_unknown:{sev:'error',label:'NPI not found in the provider registry',src:'Registry snapshot (synthetic NPPES stand-in)',conf:'High'},
  name_mismatch:{sev:'warning',label:'Name differs from the registry record',src:'Registry snapshot',conf:'Medium'},
  taxonomy_unknown:{sev:'error',label:'Taxonomy code is not a recognised value',src:'Taxonomy code set',conf:'High'},
  taxonomy_mismatch:{sev:'warning',label:'Taxonomy differs from the registry record',src:'Registry snapshot',conf:'Medium'},
  license_expired:{sev:'error',label:'State licence is expired',src:'State licensing board (synthetic)',conf:'High'},
  license_lapsing:{sev:'warning',label:'State licence expires within 60 days',src:'State licensing board (synthetic)',conf:'High'},
  exclusion:{sev:'error',label:'Provider appears on the exclusion list',src:'Exclusion list (synthetic OIG LEIE stand-in)',conf:'High'},
  dup_in_file:{sev:'error',label:'Duplicate row: same NPI and location appears twice in this file',src:'This submission',conf:'High'},
  entity_ambiguous:{sev:'warning',label:'NPI matches a provider recorded under a different name',src:'Entity resolution against the plan record',conf:'Medium'},
  location_unknown:{sev:'error',label:'Location code is not one of this practice’s contracted sites',src:'Plan contract record',conf:'High'},
  address_mismatch:{sev:'warning',label:'Address differs from the registry record for this site',src:'Registry snapshot',conf:'Low'},
  tin_format:{sev:'error',label:'TIN is not nine digits',src:'Submission format rules',conf:'High'},
  phone_format:{sev:'error',label:'Phone is not a ten-digit number',src:'Submission format rules',conf:'High'},
  panel_invalid:{sev:'error',label:'Panel status is not an accepted value',src:'Submission format rules',conf:'High'},
  eff_missing:{sev:'error',label:'Effective date is missing or not a valid date',src:'Submission format rules',conf:'High'},
  term_before_eff:{sev:'error',label:'Termination date falls before the effective date',src:'Submission format rules',conf:'High'},
  eff_future:{sev:'warning',label:'Effective date is in the future',src:'Submission format rules',conf:'High'},
  term_past:{sev:'info',label:'Termination date has passed: this row will delist the provider at this site',src:'Submission format rules',conf:'High'},
};
const COLS=['npi','first_name','last_name','taxonomy','tin','location_id','address','phone','panel_status','effective_date','termination_date'];

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[];let cur=[],val='',q=false;
  const s=String(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){if(c==='"'){if(s[i+1]==='"'){val+='"';i++}else q=false}else val+=c}
    else if(c==='"')q=true;
    else if(c===','){cur.push(val);val=''}
    else if(c==='\n'){cur.push(val);rows.push(cur);cur=[];val=''}
    else val+=c}
  if(val.length||cur.length){cur.push(val);rows.push(cur)}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''))}
function rowsToObjects(rows){
  if(!rows.length)return {error:'The file is empty.'};
  const head=rows[0].map(h=>norm(h).replace(/ /g,'_'));
  const missing=COLS.filter(c=>!head.includes(c));
  if(missing.length)return {error:'These columns are missing from the header: '+missing.join(', ')+'.'};
  const out=rows.slice(1).map((r,i)=>{const o={_line:i+2};COLS.forEach(c=>{o[c]=String(r[head.indexOf(c)]==null?'':r[head.indexOf(c)]).trim()});return o});
  if(!out.length)return {error:'The file has a header but no data rows.'};
  if(out.length>500)return {error:'This file has more than 500 rows. Split it and submit in parts.'};
  return {rows:out}}

/* ---------- generation ---------- */
function generate(){
  const r=mulberry32(SEED), ri=(a,b)=>a+Math.floor(r()*(b-a+1)), pick=a=>a[Math.floor(r()*a.length)];
  const submitters=[],locations=[],registry=[],plan=[],exclusions=[],licences={};
  PRACTICES.forEach((nm,i)=>{
    const st=STATES[i%STATES.length];
    const sub={id:'SUB-'+pad(i+1,2),name:nm,tin:String(ri(100000000,999999999)),state:st,
      kind:i===0?'independent practice':i<3?'delegated entity':i<7?'large group':'independent practice',
      channel:i%3===0?'portal':i%3===1?'email':'sftp'};
    submitters.push(sub);
    const n=i===0?3:ri(1,3);
    for(let j=1;j<=n;j++)locations.push({id:sub.id+'-L'+j,sub:sub.id,
      name:`${TOWN[(i+j)%TOWN.length]} ${['Clinic','Office','Center'][j-1]||'Site'}`,
      addr:`${ri(10,9899)} ${pick(STREET)} ${pick(['St','Ave','Blvd'])}, ${TOWN[(i+j)%TOWN.length]} ${st}`,
      phone:fmtPhone(String(ri(201,989))+'555'+pad(ri(0,9999),4))});
  });
  let pn=0;
  submitters.forEach((sub,si)=>{
    const locs=locations.filter(l=>l.sub===sub.id);
    const count=si===0?18:ri(16,34);
    for(let k=0;k<count;k++){
      pn++;
      let npi=npiMake(String(ri(100000000,999999999)));
      const tax=pick(TAX_CODES);
      const prov={npi,first:pick(FIRST),last:pick(LAST),taxonomy:tax,sub:sub.id};
      registry.push({npi,first:prov.first,last:prov.last,taxonomy:tax,
        addr:locs[0].addr,updated:fromDay(ASOF-ri(30,900))});
      licences[npi]={state:sub.state,expires:fromDay(ASOF+(r()<0.06?-ri(5,300):ri(20,900)))};
      if(r()<0.012)exclusions.push(npi);
      const chosen=locs.filter(()=>r()<0.62);
      (chosen.length?chosen:[locs[0]]).forEach(l=>{
        const age=r()<0.5?ri(3,88):ri(91,320);
        plan.push({id:'LS-'+pad(plan.length+1,4),npi,sub:sub.id,loc:l.id,
          first:prov.first,last:prov.last,taxonomy:tax,tin:sub.tin,
          address:l.addr,phone:l.phone,panel_status:pick(PANEL),
          effective_date:fromDay(ASOF-ri(200,1400)),termination_date:'',
          lastV:fromDay(ASOF-age),basis:r()<0.4?'attested':r()<0.7?'inferred':'carried',
          status:'listed'});
      });
    }
  });
  return {submitters,locations,registry,licences,exclusions,plan}}

/* ---------- validation ---------- */
function validateRow(S,row,allRows,sub){
  const f=[];const add=(k,extra)=>f.push(Object.assign({key:k},RULES[k],extra||{}));
  const npi=String(row.npi||'').trim();
  if(!npiValid(npi))add('npi_format');
  const reg=S.registry.find(x=>x.npi===npi);
  if(npiValid(npi)&&!reg)add('npi_unknown');
  if(reg){
    if(norm(reg.first)!==norm(row.first_name)||norm(reg.last)!==norm(row.last_name))
      add('name_mismatch',{detail:`file says ${row.first_name} ${row.last_name}, registry says ${reg.first} ${reg.last}`});
    if(row.taxonomy&&reg.taxonomy!==row.taxonomy&&TAXONOMY[row.taxonomy])
      add('taxonomy_mismatch',{detail:`file says ${TAXONOMY[row.taxonomy]}, registry says ${TAXONOMY[reg.taxonomy]}`});
  }
  if(!TAXONOMY[row.taxonomy])add('taxonomy_unknown',{detail:`"${row.taxonomy}" is not in the code set`});
  const lic=S.licences[npi];
  if(lic){const d=toDay(lic.expires);
    if(d<ASOF)add('license_expired',{detail:`expired ${lic.expires}`});
    else if(d-ASOF<=60)add('license_lapsing',{detail:`expires ${lic.expires}`});}
  if(S.exclusions.includes(npi))add('exclusion',{detail:'this row cannot be accepted'});
  if(allRows.filter(x=>String(x.npi).trim()===npi&&x.location_id===row.location_id).length>1)
    add('dup_in_file');
  const other=S.plan.find(p=>p.npi===npi&&(norm(p.first)!==norm(row.first_name)||norm(p.last)!==norm(row.last_name)));
  if(other&&!reg)add('entity_ambiguous',{detail:`the plan record holds this NPI as ${other.first} ${other.last}`});
  const loc=S.locations.find(l=>l.id===row.location_id&&l.sub===sub.id);
  if(!loc)add('location_unknown',{detail:`"${row.location_id}" is not contracted for ${sub.name}`});
  else if(norm(loc.addr)!==norm(row.address))add('address_mismatch',{detail:`plan record: ${loc.addr}`});
  if(!/^\d{9}$/.test(String(row.tin).replace(/\D/g,'')))add('tin_format');
  if(!phoneOk(row.phone))add('phone_format');
  if(!PANEL.includes(row.panel_status))add('panel_invalid',{detail:`accepted values: ${PANEL.join(', ')}`});
  if(!isDate(row.effective_date))add('eff_missing');
  if(isDate(row.effective_date)&&toDay(row.effective_date)>ASOF)add('eff_future');
  if(row.termination_date){
    if(!isDate(row.termination_date))add('term_before_eff',{detail:'termination date is not a valid date'});
    else{
      if(isDate(row.effective_date)&&toDay(row.termination_date)<toDay(row.effective_date))add('term_before_eff');
      else if(toDay(row.termination_date)<=ASOF)add('term_past');
    }
  }
  const errors=f.filter(x=>x.sev==='error').length, warnings=f.filter(x=>x.sev==='warning').length;
  return {findings:f,errors,warnings,clean:errors===0&&warnings===0}}

function diffRow(S,row){
  const existing=S.plan.find(p=>p.npi===String(row.npi).trim()&&p.loc===row.location_id&&p.status==='listed');
  if(!existing)return {kind:'add',fields:[],existing:null};
  const fields=[];
  [['first','first_name'],['last','last_name'],['taxonomy','taxonomy'],['tin','tin'],['address','address'],['phone','phone'],['panel_status','panel_status'],['effective_date','effective_date']].forEach(([a,b])=>{
    const was=String(existing[a]||''),now=String(row[b]||'');
    if(norm(was)!==norm(now))fields.push({field:b,was,now})});
  if(row.termination_date&&isDate(row.termination_date)&&toDay(row.termination_date)<=ASOF)
    return {kind:'terminate',fields,existing};
  return {kind:fields.length?'change':'same',fields,existing}}

function buildSubmission(S,sub,rows,channel){
  const items=rows.map(r=>{const v=validateRow(S,r,rows,sub);const d=diffRow(S,r);
    return {row:r,v,d,decision:null,note:''}});
  const errors=items.filter(i=>i.v.errors>0).length;
  return {id:'SB-'+pad(S.submissions.length+1,3),sub:sub.id,channel,created:Date.now(),
    status:'draft',items,rows:rows.length,errorRows:errors,
    firstPassClean:items.filter(i=>i.v.clean).length,submittedAt:null,decidedAt:null,attestedBy:null}}

function submitSubmission(S,sb,who){
  if(sb.items.some(i=>i.v.errors>0))return {ok:false,error:'Fix every blocking error before submitting.'};
  sb.status='submitted';sb.submittedAt=Date.now();sb.attestedBy=who;
  S.audit.push({t:Date.now(),sb:sb.id,who,action:'attested and submitted',
    detail:`${sb.rows} rows, ${sb.items.filter(i=>i.d.kind!=='same').length} changes`});
  return {ok:true}}

function decideItem(S,sb,idx,decision,note){
  const it=sb.items[idx];
  if(decision==='reject'&&!String(note||'').trim())return {ok:false,error:'A rejection needs a reason the practice can act on.'};
  it.decision=decision;it.note=String(note||'').trim();
  return {ok:true}}

function finaliseSubmission(S,sb,who){
  const undecided=sb.items.filter(i=>i.decision===null).length;
  if(undecided)return {ok:false,error:`${undecided} row${undecided>1?'s have':' has'} no decision yet.`};
  let applied=0,rejected=0;
  sb.items.forEach(it=>{
    if(it.decision!=='approve'){rejected++;return}
    const r=it.row,d=it.d;
    if(d.kind==='terminate'&&d.existing){d.existing.status='terminated';d.existing.termination_date=r.termination_date;
      emit(S,'provider.location.terminated',{npi:r.npi,location:r.location_id,effective:r.termination_date})}
    else if(d.kind==='add'){
      S.plan.push({id:'LS-'+pad(S.plan.length+1,4),npi:String(r.npi).trim(),sub:sb.sub,loc:r.location_id,
        first:r.first_name,last:r.last_name,taxonomy:r.taxonomy,tin:r.tin,address:r.address,phone:r.phone,
        panel_status:r.panel_status,effective_date:r.effective_date,termination_date:'',
        lastV:ASOF_ISO,basis:'attested',status:'listed'});
      emit(S,'provider.location.added',{npi:r.npi,location:r.location_id,taxonomy:r.taxonomy})}
    else{const e=d.existing;
      if(e){Object.assign(e,{first:r.first_name,last:r.last_name,taxonomy:r.taxonomy,tin:r.tin,
        address:r.address,phone:r.phone,panel_status:r.panel_status,effective_date:r.effective_date,
        lastV:ASOF_ISO,basis:'attested'});
        if(d.kind==='change')emit(S,'provider.record.updated',{npi:r.npi,location:r.location_id,fields:d.fields.map(f=>f.field)});
        else emit(S,'provider.record.attested',{npi:r.npi,location:r.location_id})}}
    applied++});
  sb.status='completed';sb.decidedAt=Date.now();
  S.audit.push({t:Date.now(),sb:sb.id,who,action:'review completed',detail:`${applied} approved, ${rejected} rejected`});
  S.turnarounds.push({sb:sb.id,hours:(sb.decidedAt-sb.submittedAt)/36e5});
  return {ok:true,applied,rejected}}

function emit(S,type,payload){
  S.events.push({seq:S.events.length+1,t:Date.now(),type,payload,
    endpoints:['claims','directory','prior-auth','care-coordination']})}

/* ---------- sample files ---------- */
function sampleFile(S,kind){
  const sub=S.submitters.find(s=>s.id===FOCAL);
  const locs=S.locations.filter(l=>l.sub===sub.id);
  const mine=S.plan.filter(p=>p.sub===sub.id&&p.status==='listed');
  const head=COLS.join(',');
  const line=o=>COLS.map(c=>{const v=String(o[c]==null?'':o[c]);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',');
  const base=p=>({npi:p.npi,first_name:p.first,last_name:p.last,taxonomy:p.taxonomy,tin:p.tin,
    location_id:p.loc,address:p.address,phone:p.phone,panel_status:p.panel_status,
    effective_date:p.effective_date,termination_date:''});
  let rows=mine.map(base);
  if(kind==='clean')return [head].concat(rows.map(line)).join('\n');
  if(kind==='errors'){
    rows=rows.map(o=>Object.assign({},o));
    if(rows[0])rows[0].npi=String(rows[0].npi).slice(0,9)+((Number(String(rows[0].npi).slice(-1))+1)%10);
    if(rows[1])rows[1].taxonomy='999ZZ0000X';
    if(rows[2])rows[2].panel_status='maybe';
    if(rows[3])rows[3].phone='555-12';
    if(rows[4])rows[4].location_id=sub.id+'-L9';
    if(rows[5])rows[5].termination_date='2024-01-01';
    if(rows[6])rows[6].tin='12345';
    if(rows[7]){rows[7].first_name='Alex';rows[7].address='12 Unknown Rd, Elsewhere '+sub.state}
    if(rows[8])rows.push(Object.assign({},rows[8]));
    if(rows[9])rows[9].termination_date=fromDay(ASOF-9);
    return [head].concat(rows.map(line)).join('\n');
  }
  if(kind==='changes'){
    rows=rows.map(o=>Object.assign({},o));
    if(rows[0])rows[0].phone=fmtPhone('2065550147');
    if(rows[1])rows[1].panel_status='not_accepting';
    if(rows[2])rows[2].termination_date=fromDay(ASOF-5);
    if(rows[3])rows[3].address=locs[0].addr;
    const reg=S.registry.find(x=>!mine.some(p=>p.npi===x.npi));
    if(reg&&locs[0])rows.push({npi:reg.npi,first_name:reg.first,last_name:reg.last,taxonomy:reg.taxonomy,
      tin:sub.tin,location_id:locs[0].id,address:locs[0].addr,phone:locs[0].phone,
      panel_status:'accepting',effective_date:fromDay(ASOF-14),termination_date:''});
    return [head].concat(rows.map(line)).join('\n');
  }
  return [head].concat(rows.map(line)).join('\n')}

/* ---------- metrics ---------- */
const listedPlan=S=>S.plan.filter(p=>p.status==='listed');
function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);
  return s.length%2?s[m]:(s[m-1]+s[m])/2}
function metrics(S){
  const rows=listedPlan(S);
  const attested=rows.filter(p=>p.basis==='attested').length;
  const inCycle=rows.filter(p=>p.lastV&&ASOF-toDay(p.lastV)<=90).length;
  const done=S.submissions.filter(s=>s.status==='completed');
  const allItems=S.submissions.filter(s=>s.status!=='draft').reduce((t,s)=>t+s.rows,0);
  const cleanItems=S.submissions.filter(s=>s.status!=='draft').reduce((t,s)=>t+s.firstPassClean,0);
  const viaPortal=S.submissions.filter(s=>s.status!=='draft'&&s.channel==='portal').length;
  const subsDone=S.submissions.filter(s=>s.status!=='draft').length;
  return {n:rows.length,attested,attestedPct:rows.length?attested/rows.length*100:0,
    inCycle,inCyclePct:rows.length?inCycle/rows.length*100:0,
    firstPass:allItems?cleanItems/allItems*100:null,
    turnaround:median(S.turnarounds.map(t=>t.hours)),
    submissions:subsDone,completed:done.length,
    portalShare:subsDone?viaPortal/subsDone*100:null,
    events:S.events.length,
    activated:new Set(S.submissions.filter(s=>s.status!=='draft').map(s=>s.sub)).size,
    activationPct:new Set(S.submissions.filter(s=>s.status!=='draft').map(s=>s.sub)).size/S.submitters.length*100}}
const KPIDEF={
  firstPass:{name:'First-pass validation rate',def:'Rows with no error and no warning on first upload, divided by rows uploaded.',src:'Computed from submissions in this session.',owner:'Provider data operations',thr:'Target 85% or better. Assumption until benchmarked.'},
  turnaround:{name:'Median roster turnaround',def:'Hours from provider submission to the plan completing its review.',src:'Computed from completed submissions.',owner:'Provider data operations',thr:'Target under 24 hours, against a baseline measured in days. Assumption until benchmarked.'},
  attested:{name:'Provider-attested share',def:'Listings whose current values were confirmed by the submitting organisation, divided by active listings.',src:'Plan record, basis field.',owner:'Network management',thr:'Rising trend. No regulatory threshold.'},
  inCycle:{name:'Verified within 90 days',def:'Active listings last verified within 90 days, divided by active listings.',src:'Plan record, last-verified field.',owner:'Compliance',thr:'No Surprises Act requires verification at least every 90 days.'},
  activation:{name:'Submitter activation',def:'Distinct submitting organisations that have sent at least one submission, divided by contracted organisations.',src:'Computed from submissions.',owner:'Go-to-market and post-sales',thr:'Pilot target 60% of invited organisations. Assumption.'},
  portal:{name:'Share submitted through the layer',def:'Submissions received through the validation layer, divided by all submissions recorded.',src:'Computed from submissions.',owner:'Provider data operations',thr:'Rising share, with email and SFTP falling. Assumption.'},
};

/* ---------- self tests ---------- */
function runTests(){
  const R=[];const T=(id,name,fn)=>{let ok=false,msg='';try{const v=fn();ok=v===true;msg=ok?'':String(v)}catch(e){msg=e.message}R.push({id,name,ok,msg})};
  const S0=freshState();
  const sub=S0.submitters.find(s=>s.id===FOCAL);
  const load=kind=>{const r=rowsToObjects(parseCSV(sampleFile(S0,kind)));if(r.error)throw new Error(r.error);return r.rows};
  T('T1','Dataset builds: 12 submitters, locations, registry, plan record',()=>
    S0.submitters.length===12&&S0.locations.length>=12&&S0.registry.length>=250&&S0.plan.length>=300);
  T('T2','Generator is deterministic for the seed',()=>JSON.stringify(generate())===JSON.stringify(generate()));
  T('T3','CSV parser handles quoted fields containing commas',()=>{
    const r=parseCSV('a,b\n"x, y",z');return r[1][0]==='x, y'&&r[1][1]==='z'});
  T('T4','A header missing a required column is rejected by name',()=>{

  T('T5','A file with a header but no rows is rejected',()=>!!rowsToObjects(parseCSV(COLS.join(','))).error);
  T('T6','The clean sample file validates with zero errors',()=>{
    const rows=load('clean');return rows.every(r=>validateRow(S0,r,rows,sub).errors===0)});
  T('T7','The clean sample file produces no changes against the plan record',()=>{
    const rows=load('clean');return rows.every(r=>diffRow(S0,r).kind==='same')});
  T('T8','NPI check digit: a corrupted NPI raises npi_format',()=>{
    const rows=load('errors');
    return validateRow(S0,rows[0],rows,sub).findings.some(f=>f.key==='npi_format')});
  T('T9','An unrecognised taxonomy code is an error',()=>{
    const rows=load('errors');
    return validateRow(S0,rows[1],rows,sub).findings.some(f=>f.key==='taxonomy_unknown')});
  T('T10','An invalid panel status is an error',()=>{
    const rows=load('errors');
    return validateRow(S0,rows[2],rows,sub).findings.some(f=>f.key==='panel_invalid')});
  T('T11','A malformed phone is an error',()=>{
    const rows=load('errors');
    return validateRow(S0,rows[3],rows,sub).findings.some(f=>f.key==='phone_format')});
  T('T12','A location not contracted for this submitter is an error',()=>{
    const rows=load('errors');
    return validateRow(S0,rows[4],rows,sub).findings.some(f=>f.key==='location_unknown')});
  T('T13','A termination date before the effective date is an error',()=>{
    const rows=load('errors');
    return validateRow(S0,rows[5],rows,sub).findings.some(f=>f.key==='term_before_eff')});
  T('T14','A short TIN is an error',()=>{
    const rows=load('errors');
    return validateRow(S0,rows[6],rows,sub).findings.some(f=>f.key==='tin_format')});
  T('T15','A name that differs from the registry is a warning, not a block',()=>{
    const rows=load('errors');const v=validateRow(S0,rows[7],rows,sub);
    const f=v.findings.find(x=>x.key==='name_mismatch');return !!f&&f.sev==='warning'});
  T('T16','A duplicated NPI and location in one file is an error on both rows',()=>{
    const rows=load('errors');
    const dups=rows.filter(r=>validateRow(S0,r,rows,sub).findings.some(f=>f.key==='dup_in_file'));
    return dups.length===2});
  T('T17','Every finding carries a rule, a source and a confidence',()=>{
    const rows=load('errors');
    return rows.every(r=>validateRow(S0,r,rows,sub).findings.every(f=>f.label&&f.src&&f.conf&&f.sev))});
  T('T18','A past termination date is read as a delisting, not an error',()=>{
    const rows=load('errors');const v=validateRow(S0,rows[9],rows,sub);
    return v.findings.some(f=>f.key==='term_past')&&!v.findings.some(f=>f.key==='term_before_eff')});
  T('T19','Diff detects a changed phone as a change, not an addition',()=>{
    const rows=load('changes');const d=diffRow(S0,rows[0]);
    return d.kind==='change'&&d.fields.some(f=>f.field==='phone')});
  T('T20','Diff detects a provider absent from the plan record as an addition',()=>{
    const rows=load('changes');return diffRow(S0,rows[rows.length-1]).kind==='add'});
  T('T21','Submission is blocked while any blocking error remains',()=>{
    const S=structuredClone(S0);const rows=rowsToObjects(parseCSV(sampleFile(S,'errors'))).rows;
    const sb=buildSubmission(S,S.submitters[0],rows,'portal');S.submissions.push(sb);
    return submitSubmission(S,sb,'tester').ok===false});
  T('T22','A clean submission submits and records who attested',()=>{
    const S=structuredClone(S0);const rows=rowsToObjects(parseCSV(sampleFile(S,'clean'))).rows;
    const sb=buildSubmission(S,S.submitters[0],rows,'portal');S.submissions.push(sb);
    const r=submitSubmission(S,sb,'tester');
    return r.ok&&sb.status==='submitted'&&sb.attestedBy==='tester'&&S.audit.length===1});
  T('T23','Review cannot be finalised while a row is undecided',()=>{
    const S=structuredClone(S0);const rows=rowsToObjects(parseCSV(sampleFile(S,'changes'))).rows;
    const sb=buildSubmission(S,S.submitters[0],rows,'portal');S.submissions.push(sb);
    submitSubmission(S,sb,'tester');
    return finaliseSubmission(S,sb,'reviewer').ok===false});
  T('T24','A rejection without a reason is refused',()=>{
    const S=structuredClone(S0);const rows=rowsToObjects(parseCSV(sampleFile(S,'changes'))).rows;
    const sb=buildSubmission(S,S.submitters[0],rows,'portal');
    return decideItem(S,sb,0,'reject','   ').ok===false});
  T('T25','Approving an addition creates that listing and emits an event',()=>{
    const S=structuredClone(S0);const rows=rowsToObjects(parseCSV(sampleFile(S,'changes'))).rows;
    const sb=buildSubmission(S,S.submitters[0],rows,'portal');S.submissions.push(sb);
    submitSubmission(S,sb,'tester');
    const addIx=sb.items.findIndex(i=>i.d.kind==='add');
    if(addIx<0)return 'no addition row in the sample';
    const r0=sb.items[addIx].row;
    if(listedPlan(S).some(p=>p.npi===String(r0.npi).trim()&&p.loc===r0.location_id))return 'listing already present before approval';
    sb.items.forEach((it,i)=>decideItem(S,sb,i,'approve',''));
    const r=finaliseSubmission(S,sb,'reviewer');
    const made=listedPlan(S).find(p=>p.npi===String(r0.npi).trim()&&p.loc===r0.location_id);
    return r.ok&&!!made&&made.basis==='attested'&&S.events.some(e=>e.type==='provider.location.added')});
  T('T26','Approving a termination delists that one listing and emits an event',()=>{
    const S=structuredClone(S0);const rows=rowsToObjects(parseCSV(sampleFile(S,'changes'))).rows;
    const sb=buildSubmission(S,S.submitters[0],rows,'portal');S.submissions.push(sb);
    submitSubmission(S,sb,'tester');
    const term=sb.items.findIndex(i=>i.d.kind==='terminate');
    if(term<0)return 'no termination row in the sample';
    const target=sb.items[term].d.existing;
    if(target.status!=='listed')return 'target was not listed to begin with';
    sb.items.forEach((it,i)=>decideItem(S,sb,i,'approve',''));
    finaliseSubmission(S,sb,'reviewer');
    return target.status==='terminated'&&!listedPlan(S).includes(target)&&S.events.some(e=>e.type==='provider.location.terminated')});
  T('T27','A rejected row leaves the plan record untouched',()=>{
    const S=structuredClone(S0);const rows=rowsToObjects(parseCSV(sampleFile(S,'changes'))).rows;
    const sb=buildSubmission(S,S.submitters[0],rows,'portal');S.submissions.push(sb);
    submitSubmission(S,sb,'tester');
    const ix=sb.items.findIndex(i=>i.d.kind==='change');
    const before=JSON.stringify(sb.items[ix].d.existing);
    sb.items.forEach((it,i)=>decideItem(S,sb,i,i===ix?'reject':'approve',i===ix?'Not confirmed by contracting':''));
    finaliseSubmission(S,sb,'reviewer');
    return JSON.stringify(sb.items[ix].d.existing)===before});
  T('T28','Approving a change sets the basis to attested and the verification date to today',()=>{
    const S=structuredClone(S0);const rows=rowsToObjects(parseCSV(sampleFile(S,'changes'))).rows;
    const sb=buildSubmission(S,S.submitters[0],rows,'portal');S.submissions.push(sb);
    submitSubmission(S,sb,'tester');
    const ix=sb.items.findIndex(i=>i.d.kind==='change');
    sb.items.forEach((it,i)=>decideItem(S,sb,i,'approve',''));
    finaliseSubmission(S,sb,'reviewer');
    const e=sb.items[ix].d.existing;return e.basis==='attested'&&e.lastV===ASOF_ISO});
  T('T29','Turnaround is recorded and the first-pass rate is computed from rows, not files',()=>{
    const S=structuredClone(S0);const rows=rowsToObjects(parseCSV(sampleFile(S,'clean'))).rows;
    const sb=buildSubmission(S,S.submitters[0],rows,'portal');S.submissions.push(sb);
    submitSubmission(S,sb,'tester');
    sb.items.forEach((it,i)=>decideItem(S,sb,i,'approve',''));
    finaliseSubmission(S,sb,'reviewer');
    const m=metrics(S);return S.turnarounds.length===1&&m.firstPass===100});
  T('T30','Every KPI on the dashboard has a definition, source, owner and threshold',()=>
    Object.values(KPIDEF).every(k=>k.name&&k.def&&k.src&&k.owner&&k.thr));
  T('T31','Business-day count: Friday to Monday is one business day',()=>bizDays(toDay('2026-11-06'),toDay('2026-11-09'))===1);
  T('T32','Exclusion-list and expired-licence rows both block submission',()=>{
    const bad={npi:'1234567890',first_name:'A',last_name:'B',taxonomy:'999',tin:'1',location_id:'X',
      address:'',phone:'',panel_status:'',effective_date:'',termination_date:''};
    const v=validateRow(S0,bad,[bad],sub);return v.errors>=4});
  return R}

  <p>Providers submit once, in their own format. Every row is checked against the registry, the licensing board, the exclusion list and the plan's own record, with the rule, the source and the confidence shown for each finding. The plan reviews a clean, diffed file instead of a spreadsheet by email, and approved changes flow straight to claims, the directory and prior authorisation.</p>
  <div class="roles">${roles.map(r=>`<button class="role" data-a="role" data-v="${r[0]}"><b>${r[1]}</b><span class="muted">${r[2]}</span></button>`).join('')}</div>
  <p style="margin-top:26px;font-size:12px;color:#8fa5d8">Synthetic data: ${S.submitters.length} contracted organisations, ${S.plan.length} listings, ${S.registry.length} registry records &middot; as-of ${ASOF_ISO} &middot; resets on refresh</p></div>`}

function header(t,sub){return `<div class="top"><div><h1>${esc(t)}</h1>${sub?`<div class="muted" style="font-size:12px">${esc(sub)}</div>`:''}</div>
  <span class="sp"></span><button class="btn sm" data-a="switch">Switch role</button><button class="btn sm" data-a="drawer">About</button></div>`}

/* ---------- provider: submit ---------- */
function vSubmit(){
  const sub=subOf(S.ui.sub);const d=S.ui.draft;
  if(!d)return header('Submit a roster',sub.name+' · TIN '+sub.tin)+`<div class="page">
  <div class="info">Upload a roster in CSV. Required columns: <span class="mono">${COLS.join(', ')}</span>. Nothing is sent to the plan until you have cleared every blocking error and attested.</div>
  <div class="grid two-e">
    <div class="card"><h2>Upload a file</h2>
      <div class="fld"><label for="fi">Choose a CSV file</label><input id="fi" type="file" accept=".csv,text/csv" data-c="file"></div>
      <p class="muted">Or paste the contents below. Both paths run the same validation.</p>
      <form data-f="paste"><div class="fld"><label for="csv">Paste CSV</label><textarea id="csv" rows="7" data-c="csv" placeholder="${esc(COLS.join(','))}">${esc(S.ui.csv)}</textarea></div>
      ${S.ui.parseErr?`<div class="err" role="alert">${esc(S.ui.parseErr)}</div>`:''}
      <button class="btn solid" type="submit">Validate</button></form></div>
    <div class="card"><h2>Start from a sample</h2>
      <p class="muted">Three synthetic files for this practice, so the validation can be seen end to end.</p>
      <div class="row">
        <button class="btn" data-a="sample" data-v="clean">Monthly roster, no changes</button>
        <button class="btn" data-a="sample" data-v="changes">Roster with real changes</button>
        <button class="btn" data-a="sample" data-v="errors">Roster with ten problems</button>
      </div>
      <h3 style="margin-top:16px">What is checked</h3>
      <div class="scroll"><table><thead><tr><th>Check</th><th>Source</th><th>Severity</th></tr></thead><tbody>
      ${Object.values(RULES).map(r=>`<tr><td style="white-space:normal">${esc(r.label)}</td><td class="src" style="white-space:normal">${esc(r.src)}</td><td><span class="pill ${r.sev==='error'?'p-rm':r.sev==='warning'?'p-in':'p-gr'}">${r.sev}</span></td></tr>`).join('')}
      </tbody></table></div></div>
  </div></div>`;

  const errs=d.items.filter(i=>i.v.errors>0).length;
  const warns=d.items.filter(i=>i.v.errors===0&&i.v.warnings>0).length;
  const clean=d.items.filter(i=>i.v.clean).length;
  const changes=d.items.filter(i=>i.d.kind!=='same').length;
  const f=S.ui.filter;
  const show=d.items.map((it,i)=>({it,i})).filter(({it})=>
    f==='all'?true:f==='errors'?it.v.errors>0:f==='warnings'?it.v.errors===0&&it.v.warnings>0:
    f==='changes'?it.d.kind!=='same':it.v.clean);
  return header('Validation report',`${sub.name} · ${d.rows} rows · ${d.channel}`)+`<div class="page">
  <div class="grid kpis">
    <div class="kpi" data-a="filt" data-v="all"><div class="l">Rows</div><div class="v">${d.rows}</div><div class="s">in this file</div></div>
    <div class="kpi" data-a="filt" data-v="errors"><div class="l">Blocking errors</div><div class="v" style="color:${errs?'var(--badt)':'var(--navy2)'}">${errs}</div><div class="s">must be fixed to submit</div></div>
    <div class="kpi" data-a="filt" data-v="warnings"><div class="l">Warnings</div><div class="v">${warns}</div><div class="s">can be attested as-is</div></div>
    <div class="kpi" data-a="filt" data-v="clean"><div class="l">First-pass clean</div><div class="v">${pc(d.rows?clean/d.rows*100:0)}</div><div class="s">${clean} of ${d.rows} rows</div></div>
    <div class="kpi" data-a="filt" data-v="changes"><div class="l">Changes vs plan record</div><div class="v">${changes}</div><div class="s">additions, edits, terminations</div></div>
  </div>
  ${errs?`<div class="bad">${errs} row${errs>1?'s':''} cannot be submitted until fixed. Each one says which rule fired, where the rule looked, and how confident it is.</div>`
    :`<div class="okb">No blocking errors. Review the ${changes} change${changes===1?'':'s'} below, then attest and submit.</div>`}
  <div class="row" style="margin-bottom:10px">
    <div class="tabs" style="margin:0">${[['all','All rows'],['errors','Errors'],['warnings','Warnings'],['changes','Changes'],['clean','Clean']].map(x=>`<button class="tab ${f===x[0]?'on':''}" data-a="filt" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
    <span class="sp"></span>
    <button class="btn" data-a="discard">Discard</button>
    <button class="btn primary" data-a="attest" ${errs?'disabled':''}>Attest and submit</button>
  </div>
  ${show.length?show.map(({it,i})=>rowCard(it,i)).join(''):'<p class="muted">No rows match this filter.</p>'}
  </div>`}

function rowCard(it,i){
  const r=it.row,v=it.v,d=it.d;
  const cls=v.errors?'e':v.warnings?'w':'okr';
  const dk={add:['p-ok','New at this location'],change:['p-in','Changed'],terminate:['p-rm','Termination'],same:['p-gr','No change']}[d.kind];
  return `<div class="rowc ${cls}">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><b>${esc(r.first_name)} ${esc(r.last_name)}</b> <span class="mono">${esc(r.npi)}</span>
      <span class="pill ${dk[0]}">${dk[1]}</span><br>
      <span class="muted">${esc(TAXONOMY[r.taxonomy]||r.taxonomy)} &middot; ${esc(r.location_id)} &middot; ${esc(r.phone)} &middot; ${esc(r.panel_status)}</span>
      <span class="src"> &middot; line ${r._line}</span></div>
      <button class="btn sm" data-a="fix" data-v="${i}">${v.errors?'Fix':'Edit'}</button>
    </div>
    ${v.findings.length?`<div class="find">${v.findings.map(x=>`<div><span class="pill ${x.sev==='error'?'p-rm':x.sev==='warning'?'p-in':'p-gr'}">${x.sev}</span> <b>${esc(x.label)}</b>${x.detail?': '+esc(x.detail):''}<br><span class="src">Rule source: ${esc(x.src)} &middot; confidence ${esc(x.conf)}</span></div>`).join('')}</div>`:''}
    ${d.kind==='change'&&d.fields.length?`<div class="find"><b>Differences from the plan record</b><div class="scroll"><table><thead><tr><th>Field</th><th>Plan record</th><th>Your file</th></tr></thead><tbody>${d.fields.map(x=>`<tr><td>${esc(x.field)}</td><td class="diffdel" style="white-space:normal">${esc(x.was)||'<span class="muted">empty</span>'}</td><td class="diffadd" style="white-space:normal">${esc(x.now)||'<span class="muted">empty</span>'}</td></tr>`).join('')}</tbody></table></div></div>`:''}
  </div>`}

function vFix(){
  const i=S.ui.sel,d=S.ui.draft;
  if(!d||d.items[i]==null)return header('Edit row')+'<div class="page"><div class="card">No row selected.</div></div>';
  const it=d.items[i],r=it.row;
  const fld=(k,label,hint)=>`<div class="fld"><label for="e-${k}">${label}</label><input id="e-${k}" type="text" data-c="edit" data-k="${k}" value="${esc(r[k])}">${hint?`<div class="src">${esc(hint)}</div>`:''}</div>`;
  return header('Edit row '+r._line,`${r.first_name} ${r.last_name}`)+`<div class="page">
  <p><button class="btn sm" data-a="back">&larr; Back to the report</button></p>
  <div class="grid two-e">
    <div class="card"><h2>Row values</h2><form data-f="fix">
      ${fld('npi','NPI','Ten digits, check digit validated')}
      ${fld('first_name','First name')}${fld('last_name','Last name')}
      ${fld('taxonomy','Taxonomy code','Recognised codes: '+TAX_CODES.slice(0,4).join(', ')+' and others')}
      ${fld('tin','TIN','Nine digits')}
      ${fld('location_id','Location code','Contracted sites: '+S.locations.filter(l=>l.sub===d.sub).map(l=>l.id).join(', '))}
      ${fld('address','Address')}${fld('phone','Phone','Ten digits')}
      ${fld('panel_status','Panel status','One of: '+PANEL.join(', '))}
      ${fld('effective_date','Effective date','YYYY-MM-DD')}
      ${fld('termination_date','Termination date','YYYY-MM-DD, or leave blank')}
      <button class="btn primary" type="submit">Revalidate this row</button>
    </form></div>
    <div class="card"><h2>Current findings</h2>
      ${it.v.findings.length?it.v.findings.map(x=>`<div class="find"><span class="pill ${x.sev==='error'?'p-rm':x.sev==='warning'?'p-in':'p-gr'}">${x.sev}</span> <b>${esc(x.label)}</b>${x.detail?': '+esc(x.detail):''}<br><span class="src">Source: ${esc(x.src)} &middot; confidence ${esc(x.conf)}</span></div>`).join(''):'<div class="okb">This row passes every check.</div>'}
    </div></div></div>`}

function vStatus(){
  const mine=S.submissions.filter(s=>s.sub===S.ui.sub&&s.status!=='draft').sort((a,b)=>b.created-a.created);
  return header('Submission status',subOf(S.ui.sub).name)+`<div class="page"><div class="card">
  ${mine.length?`<div class="scroll"><table><thead><tr><th>Submission</th><th>Channel</th><th>Rows</th><th>First-pass clean</th><th>Status</th><th>Turnaround</th></tr></thead><tbody>
  ${mine.map(sb=>{const t=S.turnarounds.find(x=>x.sb===sb.id);
    const rej=sb.items.filter(i=>i.decision==='reject');
    return `<tr><td>${sb.id}</td><td>${esc(sb.channel)}</td><td>${sb.rows}</td><td>${pc(sb.rows?sb.firstPassClean/sb.rows*100:0)}</td>
    <td><span class="pill ${sb.status==='completed'?'p-ok':'p-nv'}">${sb.status==='completed'?'reviewed':'awaiting plan review'}</span>
    ${rej.length?`<div class="src">${rej.length} row${rej.length>1?'s':''} rejected</div>`:''}</td>
    <td>${t?t.hours.toFixed(1)+'h':'pending'}</td></tr>
    ${rej.length?rej.map(i=>`<tr><td></td><td colspan="5" style="white-space:normal"><span class="pill p-rm">rejected</span> ${esc(i.row.first_name)} ${esc(i.row.last_name)} at ${esc(i.row.location_id)}: ${esc(i.note)}</td></tr>`).join(''):''}`}).join('')}
  </tbody></table></div>`:'<p class="muted">Nothing submitted yet. Start on the submit screen.</p>'}
  </div></div>`}

/* ---------- plan side ---------- */
function vQueue(){
  const q=S.submissions.filter(s=>s.status==='submitted');
  const done=S.submissions.filter(s=>s.status==='completed');
  return header('Review queue','Submissions awaiting a decision')+`<div class="page">
  <div class="card"><h2>${q.length} awaiting review</h2>
  ${q.length?`<div class="scroll"><table><thead><tr><th>Submission</th><th>Organisation</th><th>Channel</th><th>Rows</th><th>Changes</th><th>Waiting</th><th></th></tr></thead><tbody>
  ${q.map(sb=>{const ch=sb.items.filter(i=>i.d.kind!=='same').length;
    return `<tr class="click" data-a="open" data-v="${sb.id}"><td>${sb.id}</td><td>${esc(subOf(sb.sub).name)}</td><td>${esc(sb.channel)}</td><td>${sb.rows}</td><td>${ch}</td><td>${((Date.now()-sb.submittedAt)/36e5).toFixed(1)}h</td><td><button class="btn sm solid" data-a="open" data-v="${sb.id}">Review</button></td></tr>`}).join('')}
  </tbody></table></div>`:'<p class="muted">Nothing waiting. Submit a roster from the practice side to populate this queue.</p>'}
  </div>
  ${done.length?`<div class="card" style="margin-top:14px"><h2>Completed</h2><div class="scroll"><table><thead><tr><th>Submission</th><th>Organisation</th><th>Rows</th><th>Approved</th><th>Rejected</th><th>Turnaround</th></tr></thead><tbody>
  ${done.map(sb=>{const t=S.turnarounds.find(x=>x.sb===sb.id);
    return `<tr><td>${sb.id}</td><td>${esc(subOf(sb.sub).name)}</td><td>${sb.rows}</td><td>${sb.items.filter(i=>i.decision==='approve').length}</td><td>${sb.items.filter(i=>i.decision==='reject').length}</td><td>${t?t.hours.toFixed(1)+'h':''}</td></tr>`}).join('')}
  </tbody></table></div></div>`:''}
  </div>`}

function vReview(){
  const sb=S.submissions.find(x=>x.id===S.ui.sel);
  if(!sb)return header('Review')+'<div class="page"><div class="card">No submission selected.</div></div>';
  const undecided=sb.items.filter(i=>i.decision===null).length;
  const chg=sb.items.map((it,i)=>({it,i})).filter(({it})=>it.d.kind!=='same');
  const same=sb.items.filter(i=>i.d.kind==='same').length;
  return header('Review '+sb.id,`${subOf(sb.sub).name} · ${sb.rows} rows · attested by ${esc(sb.attestedBy||'')}`)+`<div class="page">
  <p><button class="btn sm" data-a="nav" data-v="queue">&larr; Back to the queue</button></p>
  ${sb.status==='completed'?'<div class="okb">This submission has been completed.</div>':`
  <div class="info">${same} row${same===1?'':'s'} match the plan record exactly and are approved automatically on completion. ${chg.length} row${chg.length===1?'':'s'} need a decision.</div>
  <div class="row" style="margin-bottom:12px">
    <button class="btn ok" data-a="allapprove">Approve all changes</button>
    <span class="sp"></span>
    <span class="muted">${undecided} undecided</span>
    <button class="btn primary" data-a="finalise" ${undecided?'disabled':''}>Complete review</button>
  </div>`}
  ${chg.map(({it,i})=>reviewCard(sb,it,i)).join('')||'<p class="muted">No changes in this submission.</p>'}
  </div>`}

function reviewCard(sb,it,i){
  const r=it.row,d=it.d;
  const dk={add:['p-ok','New at this location'],change:['p-in','Changed'],terminate:['p-rm','Termination']}[d.kind]||['p-gr','No change'];
  const dec=it.decision;
  return `<div class="rowc ${dec==='approve'?'okr':dec==='reject'?'e':''}">
  <div class="row" style="justify-content:space-between;align-items:flex-start">
    <div><b>${esc(r.first_name)} ${esc(r.last_name)}</b> <span class="mono">${esc(r.npi)}</span> <span class="pill ${dk[0]}">${dk[1]}</span><br>
    <span class="muted">${esc(TAXONOMY[r.taxonomy]||r.taxonomy)} &middot; ${esc(r.location_id)} &middot; ${esc(r.panel_status)}</span></div>
    ${sb.status==='completed'?`<span class="pill ${dec==='approve'?'p-ok':'p-rm'}">${dec}</span>`:`<div class="row" style="align-items:center">
      <button class="btn sm ${dec==='approve'?'ok':''}" data-a="dec" data-v="${i}" data-d="approve">Approve</button>
      <button class="btn sm ${dec==='reject'?'danger':''}" data-a="rejask" data-v="${i}">Reject</button></div>`}
  </div>
  ${it.v.findings.filter(f=>f.sev!=='error').length?`<div class="find">${it.v.findings.filter(f=>f.sev!=='error').map(x=>`<div><span class="pill ${x.sev==='warning'?'p-in':'p-gr'}">${x.sev}</span> <b>${esc(x.label)}</b>${x.detail?': '+esc(x.detail):''} <span class="src">(${esc(x.src)}, ${esc(x.conf)})</span></div>`).join('')}</div>`:''}
  ${d.fields.length?`<div class="find"><div class="scroll"><table><thead><tr><th>Field</th><th>Plan record</th><th>Submitted</th></tr></thead><tbody>${d.fields.map(x=>`<tr><td>${esc(x.field)}</td><td class="diffdel" style="white-space:normal">${esc(x.was)||'empty'}</td><td class="diffadd" style="white-space:normal">${esc(x.now)||'empty'}</td></tr>`).join('')}</tbody></table></div></div>`:''}
  ${dec==='reject'&&it.note?`<div class="find"><b>Reason given to the practice:</b> ${esc(it.note)}</div>`:''}
  </div>`}

function kpiCard(key,label,value,sub){
  return `<button class="kpi" data-a="kpi" data-v="${key}"><div class="l">${label}</div><div class="v${/[a-z]{3}/.test(String(value))?' txt':''}">${value}</div><div class="s">${sub}</div><div class="th muted">definition, owner, threshold</div></button>`}
function vDash(){
  const m=metrics(S);
  const freshness=[['Name and taxonomy','Registry snapshot','daily'],['Address and phone','Submitter attestation','on submission'],
    ['Panel status','Submitter attestation','on submission'],['Licence status','Licensing board','weekly'],
    ['Exclusion status','Exclusion list','monthly'],['Claims activity','Claims warehouse','daily']];
  return header('Provider data dashboard','All contracted organisations, as of '+ASOF_ISO)+`<div class="page">
  <div class="grid kpis">
    ${kpiCard('firstPass','First-pass validation rate',pc(m.firstPass),m.firstPass===null?'no submissions yet':'rows clean on first upload')}
    ${kpiCard('turnaround','Median roster turnaround',m.turnaround===null?'No data yet':m.turnaround.toFixed(1)+'h',m.turnaround===null?'complete a review to measure':'submission to decision')}
    ${kpiCard('attested','Provider-attested share',pc(m.attestedPct),`${m.attested} of ${m.n} listings`)}
    ${kpiCard('inCycle','Verified within 90 days',pc(m.inCyclePct),`${m.inCycle} of ${m.n} listings`)}
    ${kpiCard('activation','Submitter activation',pc(m.activationPct),`${m.activated} of ${S.submitters.length} organisations`)}
    ${kpiCard('portal','Share through the layer',pc(m.portalShare),m.portalShare===null?'no submissions yet':`${m.submissions} submissions recorded`)}
  </div>
  <div class="grid two">
    <div class="card"><h2>Per-field freshness</h2>
      <p class="muted">Refresh cadence is matched to use. Attested values come from the submitting organisation; inferred values come from a reference source.</p>
      <div class="scroll"><table><thead><tr><th>Field group</th><th>Source</th><th>Refresh</th><th>Basis</th></tr></thead><tbody>
      ${freshness.map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td><td><span class="pill ${f[1].includes('attestation')?'p-at':'p-gr'}">${f[1].includes('attestation')?'attested':'inferred'}</span></td></tr>`).join('')}
      </tbody></table></div></div>
    <div class="card"><h2>Submissions by organisation</h2>
      <div class="scroll"><table><thead><tr><th>Organisation</th><th>Type</th><th>Usual channel</th><th>Listings</th><th>Submissions</th></tr></thead><tbody>
      ${S.submitters.map(s=>{const rows=listedPlan(S).filter(p=>p.sub===s.id).length;
        const subs=S.submissions.filter(x=>x.sub===s.id&&x.status!=='draft').length;
        return `<tr><td>${esc(s.name)}</td><td>${esc(s.kind)}</td><td>${esc(s.channel)}</td><td>${rows}</td><td>${subs?`<span class="pill p-ok">${subs}</span>`:'<span class="muted">0</span>'}</td></tr>`}).join('')}
      </tbody></table></div></div>
  </div></div>`}

function vFeed(){
  return header('Downstream feed','Events emitted when the plan approves a change')+`<div class="page">
  <div class="card"><h2>${S.events.length} events</h2>
  <p class="muted">Each approved change emits a typed event to the subscribing systems. This is the integration contract, shown here rather than wired to a live endpoint.</p>
  ${S.events.length?`<div class="feed">${[...S.events].reverse().map(e=>`<div>#${e.seq} <b>${esc(e.type)}</b> → ${e.endpoints.join(', ')}\n  ${esc(JSON.stringify(e.payload))}</div>`).join('')}</div>`
  :'<p class="muted">No events yet. Complete a review on the queue screen and they appear here.</p>'}
  </div></div>`}

function vAudit(){
  return header('Audit log','Append-only record of who did what')+`<div class="page"><div class="card">
  ${S.audit.length?`<div class="scroll"><table><thead><tr><th>Submission</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead><tbody>
  ${[...S.audit].reverse().map(a=>`<tr><td>${esc(a.sb)}</td><td>${esc(a.who)}</td><td><span class="pill p-at">${esc(a.action)}</span></td><td style="white-space:normal">${esc(a.detail)}</td></tr>`).join('')}
  </tbody></table></div><button class="btn sm" data-a="csvaudit" style="margin-top:10px">Export log</button>`
  :'<p class="muted">No entries yet.</p>'}
  </div></div>`}

function vSet(){
  const t=S.ui.tests;
  return header('Settings and tests')+`<div class="page"><div class="grid two-e">
  <div class="card"><h2>Data</h2>
    <p>All records live in this browser tab and reset on refresh. The dataset is generated from a fixed seed, so every visitor sees the same starting point. No real provider, practice or member data is present, and the registry, licensing board and exclusion list are synthetic stand-ins.</p>
    <button class="btn danger" data-a="resetask">Reset to the seeded dataset</button></div>
  <div class="card"><h2>Self-tests</h2>
    <p class="muted">32 checks of the parser, the validation rules, the diff, the review workflow and the metrics.</p>
    <button class="btn solid" data-a="tests">Run self-tests</button>
    ${t?`<p><b>${t.filter(x=>x.ok).length} of ${t.length} passed.</b></p>${t.map(x=>`<div><span class="pill ${x.ok?'p-ok':'p-rm'}">${x.ok?'Pass':'Fail'}</span> ${x.id} ${esc(x.name)} ${x.msg?'<span class="err">'+esc(x.msg)+'</span>':''}</div>`).join('')}`:''}
  </div></div></div>`}

function drawer(){if(!S.ui.drawer)return '';
  return `<aside class="drawer" role="dialog" aria-label="About"><div class="row" style="justify-content:space-between"><h2>About</h2><button class="btn sm" data-a="drawer">Close</button></div>
  <h3 style="margin-top:12px">What it computes</h3>
  <p>CSV parsing and header checking, all ${Object.keys(RULES).length} validation rules with their source and confidence, duplicate and entity matching, the diff against the plan record, the submission and review workflow with its guards, the effect of each approval on the plan record, the downstream event feed, the audit log, and every dashboard figure.</p>
  <h3>What stands in for production</h3>
  <p>The registry, the licensing board and the exclusion list are synthetic stand-ins for NPPES, state boards and the OIG exclusion list. The downstream feed shows the event contract rather than calling a live endpoint. Nothing is sent to anyone.</p>
  <h3>Design rules</h3>
  <p>Every finding names its rule, its source and its confidence, so a practice can disagree with it. Attested and inferred values are labelled separately and never blended. Every dashboard figure carries a definition, a source, an owner and a threshold.</p></aside>`}
function dialog(){const d=S.ui.dialog;if(!d)return '';
  return `<div class="overlay"><div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(d.title)}"><h2>${esc(d.title)}</h2>
  <div style="margin:10px 0">${d.html||esc(d.msg)}</div>
  <div class="row">${d.act?`<button class="btn ${d.act==='reject'?'danger':'primary'}" data-a="cfm" id="dfocus">${esc(d.label||'Confirm')}</button>`:''}<button class="btn" data-a="cancel" ${d.act?'':'id="dfocus"'}>${d.act?'Cancel':'Close'}</button></div></div></div>`}

function render(){
  const sc=S.ui.screen;
  if(sc==='start'){$('app').innerHTML=vStart()+dialog();return}
  const V={submit:vSubmit,fix:vFix,status:vStatus,dash:vDash,queue:vQueue,review:vReview,feed:vFeed,audit:vAudit,set:vSet};
  const body=(V[sc]||vDash)();
  const nav=S.ui.side==='practice'?NAV_P:NAV_H;
  const on=sc==='fix'?'submit':sc==='review'?'queue':sc;
  $('app').innerHTML=`<div class="shell"><nav class="rail" aria-label="Main"><div class="logo" aria-hidden="true">RVS</div>
  ${nav.map(n=>`<button class="nb ${on===n[2]?'on':''}" data-a="nav" data-v="${n[2]}" ${on===n[2]?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n[0]]}</svg>${n[1]}</button>`).join('')}
  <span class="sp"></span><button class="nb" data-a="switch"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON.back}</svg>Switch</button></nav>
  <main class="main">${body}</main></div>${drawer()}${dialog()}${S.ui.toast?`<div class="toast ${S.ui.toast.bad?'bad':''}" role="status">${esc(S.ui.toast.msg)}</div>`:''}`;
  const f=$('dfocus');if(f)f.focus()}

/* ---------- events ---------- */
function loadCSV(text,channel){
  const p=rowsToObjects(parseCSV(text));
  if(p.error){S.ui.parseErr=p.error;S.ui.csv=text;render();return false}
  S.ui.parseErr='';
  const sub=subOf(S.ui.sub);
  S.ui.draft=buildSubmission(S,sub,p.rows,channel||'portal');
  S.ui.filter='all';S.ui.screen='submit';render();window.scrollTo(0,0);return true}
function revalidate(){const d=S.ui.draft;if(!d)return;
  const rows=d.items.map(i=>i.row);
  d.items=rows.map(r=>({row:r,v:validateRow(S,r,rows,subOf(d.sub)),d:diffRow(S,r),
    decision:null,note:''}));
  d.errorRows=d.items.filter(i=>i.v.errors>0).length}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,v=t.dataset.v;
  switch(a){
    case 'role':
      S.ui.side=v==='practice'?'practice':'plan';
      S.ui.actor=v==='practice'?'Practice administrator':v==='ops'?'Provider data operations':'Network and compliance';
      S.ui.screen=v==='practice'?'submit':v==='ops'?'queue':'dash';
      render();window.scrollTo(0,0);break;
    case 'switch':S.ui.screen='start';S.ui.side=null;S.ui.sel=null;render();break;
    case 'nav':go(v);break;
    case 'drawer':S.ui.drawer=!S.ui.drawer;render();break;
    case 'sample':loadCSV(sampleFile(S,v),'portal');break;
    case 'filt':S.ui.filter=v;render();break;
    case 'fix':S.ui.sel=+v;S.ui.screen='fix';render();window.scrollTo(0,0);break;
    case 'back':S.ui.screen='submit';render();window.scrollTo(0,0);break;
    case 'discard':S.ui.draft=null;S.ui.csv='';S.ui.screen='submit';render();break;
    case 'attest':{const d=S.ui.draft;
      S.ui.dialog={title:'Attest and submit',act:'attest',label:'Attest and submit',
        html:`<p>You are confirming that the ${d.rows} rows in this file are accurate as of ${ASOF_ISO}, for ${esc(subOf(d.sub).name)}.</p><p class="muted">Your name, the time and the full file are recorded in the plan’s audit log. The plan reviews changes before they reach the directory.</p>`};
      render();break}
    case 'open':S.ui.sel=v;S.ui.screen='review';render();window.scrollTo(0,0);break;
    case 'dec':{const sb=S.submissions.find(x=>x.id===S.ui.sel);
      const r=decideItem(S,sb,+v,t.dataset.d,'');
      if(!r.ok)toast(r.error,true);render();break}
    case 'rejask':S.ui.noteFor=+v;S.ui.noteVal='';
      S.ui.dialog={title:'Reject this row',act:'reject',label:'Reject row',
        html:`<div class="fld"><label for="rn">Reason the practice will see</label><input id="rn" type="text" data-c="note" placeholder="Not confirmed by contracting"></div>`};
      render();break;
    case 'allapprove':{const sb=S.submissions.find(x=>x.id===S.ui.sel);
      sb.items.forEach((it,i)=>{if(it.decision===null)decideItem(S,sb,i,'approve','')});
      toast('All undecided rows approved.');render();break}
    case 'finalise':{const sb=S.submissions.find(x=>x.id===S.ui.sel);
      const r=finaliseSubmission(S,sb,S.ui.actor||'Provider data operations');
      if(!r.ok){toast(r.error,true);render();break}
      toast(`Review complete: ${r.applied} approved, ${r.rejected} rejected. ${S.events.length} downstream events emitted.`);
      S.ui.screen='queue';render();break}
    case 'kpi':{const k=KPIDEF[v];
      S.ui.dialog={title:k.name,html:`<p><b>Definition.</b> ${esc(k.def)}</p><p><b>Source.</b> ${esc(k.src)}</p><p><b>Owner.</b> ${esc(k.owner)}</p><p><b>Threshold.</b> ${esc(k.thr)}</p>`};
      render();break}
    case 'csvaudit':{const q=x=>'"'+String(x).replace(/"/g,'""')+'"';
      const csv=['submission,who,action,detail'].concat(S.audit.map(x=>[x.sb,x.who,x.action,x.detail].map(q).join(','))).join('\n');
      S.ui.dialog={title:'Audit log export',html:`<p class="muted">Copy the text below.</p><textarea rows="8" readonly id="csvbox">${esc(csv)}</textarea>`};
      render();break}
    case 'resetask':S.ui.dialog={title:'Reset all data?',msg:'This discards every submission made in this session and restores the seeded dataset.',act:'reset',label:'Reset data'};render();break;
    case 'tests':S.ui.tests=runTests();render();break;
    case 'cancel':S.ui.dialog=null;S.ui.noteFor=null;render();break;
    case 'cfm':{const d=S.ui.dialog;S.ui.dialog=null;
      if(d.act==='attest'){const sb=S.ui.draft;S.submissions.push(sb);
        const r=submitSubmission(S,sb,S.ui.actor||'Practice administrator');
        if(!r.ok){S.submissions.pop();toast(r.error,true);render();break}
        S.ui.draft=null;S.ui.csv='';S.ui.screen='status';
        toast('Submitted. The plan sees it in its review queue now.')}
      else if(d.act==='reject'){const sb=S.submissions.find(x=>x.id===S.ui.sel);
        const r=decideItem(S,sb,S.ui.noteFor,'reject',S.ui.noteVal);
        if(!r.ok)toast(r.error,true);S.ui.noteFor=null}
      else if(d.act==='reset'){S=freshState();S.ui.side='plan';S.ui.actor='Network and compliance';S.ui.screen='set';
        toast('Data reset to the seeded dataset.')}
      render();break}
  }});
document.addEventListener('change',e=>{
  const fi=e.target.closest('[data-c="file"]');
  if(fi&&fi.files&&fi.files[0]){const f=fi.files[0];
    if(f.size>2e6){toast('That file is larger than 2 MB. Split it and submit in parts.',true);return}
    const rd=new FileReader();
    rd.onload=()=>loadCSV(String(rd.result),'portal');
    rd.onerror=()=>toast('That file could not be read.',true);
    rd.readAsText(f);return}
  const t=e.target.closest('[data-c]');if(!t)return;
  if(t.dataset.c==='csv')S.ui.csv=t.value;
  else if(t.dataset.c==='note')S.ui.noteVal=t.value;
  else if(t.dataset.c==='edit'){const d=S.ui.draft;if(d)d.items[S.ui.sel].row[t.dataset.k]=t.value}});
document.addEventListener('input',e=>{const t=e.target.closest('[data-c="csv"],[data-c="note"],[data-c="edit"]');if(!t)return;
  if(t.dataset.c==='csv')S.ui.csv=t.value;
  else if(t.dataset.c==='note')S.ui.noteVal=t.value;
  else{const d=S.ui.draft;if(d)d.items[S.ui.sel].row[t.dataset.k]=t.value}});
document.addEventListener('submit',e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();
  if(f==='paste'){const txt=$('csv').value.trim();
    if(!txt){S.ui.parseErr='Paste a CSV, or start from one of the sample files.';render();return}
    loadCSV(txt,'portal')}
  else if(f==='fix'){revalidate();
    const it=S.ui.draft.items[S.ui.sel];
    toast(it.v.errors?`${it.v.errors} error${it.v.errors>1?'s':''} still on this row.`:'Row passes every check now.',!!it.v.errors);
    render()}});
render();
window.__DEMO={get S(){return S},runTests,generate,freshState,parseCSV,rowsToObjects,validateRow,diffRow,
  buildSubmission,submitSubmission,decideItem,finaliseSubmission,metrics,sampleFile,listedPlan,render};
</script>
</body>
